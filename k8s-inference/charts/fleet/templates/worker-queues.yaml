{{- /*
Worker scheduling queues (docs/FLEET.md "Tenants"), one cohort .Values.cohort:
  default                   the fleet's capacity: nominal GPU/CPU/memory quota of every SHARED pool (pool max minus warm
                            endpoints minus the per-node reserve). No LocalQueue points here; it lends to the tenants.
  <tenant>-default          the tenant's queue: nominal 0 on shared pools, borrowing up to the pool's capacity (capped by
                            the tenant's gpu_quota), ordered reserved -> on-demand -> spot, smallest preset first;
                            a pool in the tenant's dedicated_pools is the tenant's nominal quota and is lent to nobody.
  <tenant>-prefer-<class>   the same with the preferred class first, then the other classes by price (one profile per
                            class of the WHOLE fleet: a fleet-placed job may land in a region without that class).
Tenants compete for the fleet's capacity through Kueue's weighted fair sharing (fleet.tenants.<name>.fair_share_weight,
clusters/common/values/kueue.yaml `fairSharing`); within a queue, priority classes (customer-batch evicts bulk-backfill).
The tenant LocalQueues (charts/tenant) carry the profile names and point at <tenant>-<profile> everywhere.
*/ -}}
{{- if not (include "fleet.isControl" .) }}
{{- $region := include "fleet.region" . | fromYaml }}
{{- $pools := $region.r.pools }}
{{- $f := .Values.fleet }}
{{- $profiles := list "" }}
{{- range $c := include "fleet.classes" (include "fleet.allPools" $f | fromYaml) | fromYamlArray }}{{ $profiles = append $profiles $c }}{{ end }}
---
apiVersion: kueue.x-k8s.io/v1beta2
kind: ClusterQueue
metadata:
  name: default
  labels:
    {{- include "fleet.labels" $ | nindent 4 }}
spec:
  cohortName: {{ $.Values.cohort }}
  namespaceSelector:               # the lender: no namespace queues here
    matchExpressions: [{ key: kubernetes.io/metadata.name, operator: In, values: [none] }]
  queueingStrategy: BestEffortFIFO
  resourceGroups:
    - coveredResources: [nvidia.com/gpu, cpu, memory, nebius.ai/infiniband]   # the last: DRA InfiniBand NICs (kueue values deviceClassMappings)
      flavors:
        {{- range $pool := include "fleet.orderedPools" (dict "fleet" $f "pools" $pools "prefer" "") | fromYamlArray }}
        {{- if not (include "fleet.poolTenant" (dict "fleet" $f "pool" $pool)) }}
        {{- $q := include "fleet.quota" (dict "fleet" $f "pool" (index $pools $pool)) | fromYaml }}
        - name: {{ $pool }}
          resources:
            - { name: nvidia.com/gpu, nominalQuota: {{ $q.gpu }} }
            - { name: cpu, nominalQuota: {{ $q.cpu }} }
            - { name: memory, nominalQuota: {{ $q.memoryGi }}Gi }
            - { name: nebius.ai/infiniband, nominalQuota: {{ $q.ib }} }
        {{- end }}
        {{- end }}
{{- range $tn, $tc := default dict $f.tenants }}
{{- range $prefer := $profiles }}
---
apiVersion: kueue.x-k8s.io/v1beta2
kind: ClusterQueue
metadata:
  name: {{ $tn }}-{{ if $prefer }}prefer-{{ $prefer }}{{ else }}default{{ end }}
  labels:
    {{- include "fleet.labels" $ | nindent 4 }}
    serverless2.nebius/tenant: {{ $tn | quote }}
    {{- if $prefer }}
    serverless2.nebius/prefer: {{ $prefer | quote }}
    {{- end }}
spec:
  cohortName: {{ $.Values.cohort }}
  namespaceSelector:
    matchLabels: { kubernetes.io/metadata.name: tenant-{{ $tn }} }
  queueingStrategy: BestEffortFIFO
  fairSharing:
    weight: {{ default 1 $tc.fair_share_weight | quote }}
  flavorFungibility:
    whenCanBorrow: MayStopSearch   # take the first flavor with free cohort capacity
    whenCanPreempt: TryNextFlavor  # ... before preempting on a preferred one
  preemption:
    withinClusterQueue: LowerPriority     # customer-batch evicts bulk-backfill
    reclaimWithinCohort: Any              # take back nominal quota (dedicated pools) lent out
    borrowWithinCohort:
      policy: LowerPriority               # when borrowing, may evict lower-priority borrowers
  resourceGroups:
    - coveredResources: [nvidia.com/gpu, cpu, memory, nebius.ai/infiniband]
      flavors:
        {{- range $pool := include "fleet.orderedPools" (dict "fleet" $f "pools" $pools "prefer" $prefer) | fromYamlArray }}
        {{- $owner := include "fleet.poolTenant" (dict "fleet" $f "pool" $pool) }}
        {{- if or (not $owner) (eq $owner $tn) }}
        {{- $q := include "fleet.quota" (dict "fleet" $f "pool" (index $pools $pool)) | fromYaml }}
        - name: {{ $pool }}
          resources:
            {{- include "fleet.tenantFlavorResources" (dict "q" $q "dedicated" (eq $owner $tn) "cap" (default 0 $tc.gpu_quota)) | nindent 12 }}
        {{- end }}
        {{- end }}
{{- end }}
{{- end }}
{{- end }}
