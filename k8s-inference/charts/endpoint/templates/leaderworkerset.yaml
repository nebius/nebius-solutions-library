{{- define "endpoint.lws.container" -}}
{{- $v := .v }}{{ $wenv := .wenv }}{{ $ib := .ib }}
- name: endpoint
  image: {{ required "image is required" $v.image }}
  {{- with .command }}
  command: {{ toJson . }}
  {{- end }}
  {{- with $v.args }}
  args: {{ toJson . }}
  {{- end }}
  {{- with $v.workingDir }}
  workingDir: {{ . }}
  {{- end }}
  env:
    - name: NODE_RANK
      valueFrom: { fieldRef: { fieldPath: "metadata.labels['leaderworkerset.sigs.k8s.io/worker-index']" } }
    - { name: NNODES, value: {{ .nodes | quote }} }
    - { name: GPUS_PER_NODE, value: {{ $v.resources.gpu | quote }} }
    - { name: WORLD_SIZE, value: {{ mul .nodes (int $v.resources.gpu) | quote }} }
    - { name: MASTER_ADDR, value: {{ printf "%s-0.%s" $v.name $v.name | quote }} }   # the leader pod through the LeaderWorkerSet's headless Service
    - { name: MASTER_PORT, value: "29500" }
    {{- if gt $ib 0 }}
    - { name: NCCL_IB_HCA, value: mlx5 }
    - { name: NCCL_SOCKET_IFNAME, value: eth0 }
    - { name: UCX_NET_DEVICES, value: eth0 }
    {{- else }}
    {{- /* Ethernet between the nodes: NCCL must not try the InfiniBand transport (the nodes carry Mellanox NICs, the pod
           holds none: "unhandled system error" at communicator setup on B300, 2026-10-10) */}}
    - { name: NCCL_SOCKET_IFNAME, value: eth0 }
    - { name: NCCL_IB_DISABLE, value: "1" }
    {{- end }}
    {{- with $v.env }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
    {{- range $k, $val := $wenv }}
    - { name: {{ $k | quote }}, value: {{ $val | quote }} }
    {{- end }}
  {{- with $v.envFrom }}
  envFrom:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  ports:
    - containerPort: {{ $v.port }}
      protocol: TCP
  resources:
    {{- include "endpoint.resources" $v | nindent 4 }}
    {{- if gt $ib 0 }}
    claims: [{ name: ib }]
    {{- end }}
  {{- if .leader }}
  {{- include "endpoint.probes" $v | nindent 2 }}
  {{- end }}
  {{- with $v.containerSecurityContext }}
  securityContext:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- with include "endpoint.volumeMounts" $v }}
  volumeMounts:
    {{- . | nindent 4 }}
  {{- end }}
{{- end }}
{{- define "endpoint.lws.podspec" -}}
{{- $v := .v }}{{ $ib := .ib }}
{{- if ne $v.automountServiceAccountToken nil }}
automountServiceAccountToken: {{ $v.automountServiceAccountToken }}
{{- end }}
{{- with $v.priorityClassName }}
priorityClassName: {{ . }}
{{- end }}
{{- with $v.imagePullSecrets }}
imagePullSecrets:
  {{- range . }}
  - name: {{ . }}
  {{- end }}
{{- end }}
nodeSelector:
  serverless2.nebius/pool: {{ required "pool is required" $v.pool }}
  {{- with $v.nodeSelector }}
  {{- toYaml . | nindent 2 }}
  {{- end }}
{{- with $v.tolerations }}
tolerations:
  {{- toYaml . | nindent 2 }}
{{- end }}
{{- with $v.securityContext }}
securityContext:
  {{- toYaml . | nindent 2 }}
{{- end }}
{{- if gt $ib 0 }}
resourceClaims:
  - { name: ib, resourceClaimTemplateName: {{ printf "%s-%d" (default "ib" $v.ibClaimTemplate) $ib | quote }} }
{{- end }}
{{- with include "endpoint.weightsPrepare" $v }}
initContainers:
  {{- . | nindent 2 }}
{{- end }}
containers:
  {{- include "endpoint.lws.container" (dict "v" $v "wenv" .wenv "ib" $ib "nodes" .nodes "leader" .leader "command" .command) | nindent 2 }}
{{- with include "endpoint.volumes" $v }}
volumes:
  {{- . | nindent 2 }}
{{- end }}
{{- end }}
{{- $v := include "endpoint.values" . | fromYaml -}}
{{- $nodes := int (default 1 $v.nodes) -}}
{{- if gt $nodes 1 }}
{{- $wenv := default (dict) (default (dict) $v.weights).env -}}
{{- $ib := int (default 0 $v.ibDevices) -}}
{{- $pm := default (dict) $v.podMetadata -}}
{{- $podLabels := merge (dict "app.kubernetes.io/name" $v.name "app.kubernetes.io/part-of" "serverless2" "serverless2.nebius/model" $v.name "serverless2.nebius/protocol" (default "http" $v.protocol)) (default (dict) $pm.labels) -}}
{{- $common := dict "v" $v "wenv" $wenv "ib" $ib "nodes" $nodes }}
apiVersion: leaderworkerset.x-k8s.io/v1
kind: LeaderWorkerSet
metadata:
  name: {{ required "name is required" $v.name }}
  namespace: {{ $v.namespace }}
  labels:
    {{- include "endpoint.labels" . | nindent 4 }}
  annotations:
    serverless2.nebius/nodes: {{ $nodes | quote }}
    serverless2.nebius/interconnect: {{ default "none" $v.interconnect | quote }}
    serverless2.nebius/idle-s: {{ default 0 $v.idleSeconds | quote }}
    {{- with $v.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  replicas: {{ $v.scaling.minReplicas }}
  startupPolicy: LeaderCreated
  leaderWorkerTemplate:
    size: {{ $nodes }}
    restartPolicy: RecreateGroupOnPodRestart
    leaderTemplate:
      metadata:
        labels:
          {{- toYaml $podLabels | nindent 10 }}
          serverless2.nebius/role: leader
        {{- with $pm.annotations }}
        annotations:
          {{- toYaml . | nindent 10 }}
        {{- end }}
      spec:
        {{- include "endpoint.lws.podspec" (merge (dict "leader" true "command" $v.command) $common) | nindent 8 }}
    workerTemplate:
      metadata:
        labels:
          {{- toYaml $podLabels | nindent 10 }}
          serverless2.nebius/role: worker
        {{- with $pm.annotations }}
        annotations:
          {{- toYaml . | nindent 10 }}
        {{- end }}
      spec:
        {{- include "endpoint.lws.podspec" (merge (dict "leader" false "command" (default $v.command $v.workerCommand)) $common) | nindent 8 }}
---
# the leader serves: the Service and the gateway route carry a KServe predictor's name and labels, so the endpoint's
# SecurityPolicy (authorization.yaml), certificate and LiteLLM entry are the same as for a one-pod endpoint
apiVersion: v1
kind: Service
metadata:
  name: {{ $v.name }}-predictor
  namespace: {{ $v.namespace }}
  labels:
    {{- include "endpoint.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    leaderworkerset.sigs.k8s.io/name: {{ $v.name }}
    leaderworkerset.sigs.k8s.io/worker-index: "0"
  ports:
    - { name: http, port: 80, targetPort: {{ $v.port }}, protocol: TCP }
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ $v.name }}-predictor
  namespace: {{ $v.namespace }}
  labels:
    {{- include "endpoint.labels" . | nindent 4 }}
    serving.knative.dev/route: {{ $v.name }}-predictor
spec:
  parentRefs:
    - { group: gateway.networking.k8s.io, kind: Gateway, name: {{ $v.gatewayName }}, namespace: {{ $v.gatewayNamespace }} }
  hostnames:
    - {{ printf "%s-predictor.%s.%s" $v.name $v.namespace (required "domain is required for a multi-node endpoint" $v.domain) | quote }}
  rules:
    - matches: [{ path: { type: PathPrefix, value: / } }]
      backendRefs: [{ group: "", kind: Service, name: {{ $v.name }}-predictor, port: 80 }]
      timeouts: { request: 0s }
{{- end }}
