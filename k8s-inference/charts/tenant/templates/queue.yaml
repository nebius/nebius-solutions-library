# One LocalQueue per scheduling profile, pointing at the TENANT's ClusterQueue of that profile (charts/fleet
# `<tenant>-default`, `<tenant>-prefer-<gpu class>`: borrowing the fleet's capacity under the tenant's fair-share
# weight and gpu_quota, plus the tenant's dedicated pools; on the control cluster the MultiKueue manager queues).
# A run carries `kueue.x-k8s.io/queue-name: <profile>` (its catalog entry's first GPU class), so the same Job queues
# the same way on the manager and on any worker.
{{- range $profile := include "tenant.profiles" . | fromYamlArray }}
{{- if eq $profile "serverless2-stage-waiting" }}
{{- fail "a scheduling profile cannot be named serverless2-stage-waiting: it is the queue a waiting stage names so that Kueue admits nothing for it (services/api/stages.py)" }}
{{- end }}
---
apiVersion: kueue.x-k8s.io/v1beta2
kind: LocalQueue
metadata:
  name: {{ $profile }}
  namespace: {{ include "tenant.ns" $ }}
  labels:
    {{- include "tenant.labels" $ | nindent 4 }}
spec:
  clusterQueue: {{ $.Values.name }}-{{ $profile }}
{{- end }}
