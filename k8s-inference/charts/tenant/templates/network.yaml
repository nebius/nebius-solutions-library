{{- $c := include "tenant.cluster" . | fromYaml -}}
{{- if not $c.manager }}
# Same-namespace traffic (multi-pod runs). The cluster-wide isolation policy
# (clusters/common/manifests/ops/tenant-isolation.yaml) cannot express "my own namespace".
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: tenant-local
  namespace: {{ include "tenant.ns" . }}
spec:
  endpointSelector: {}
  ingress:
    - fromEndpoints: [{}]
  egress:
    - toEndpoints: [{}]
{{- end }}
