{{- if not .Values.name }}{{ fail "name is required" }}{{ end -}}
{{- $c := include "tenant.cluster" . | fromYaml -}}
apiVersion: v1
kind: Namespace
metadata:
  name: {{ include "tenant.ns" . }}
  labels:
    {{- include "tenant.labels" . | nindent 4 }}
    serverless2.nebius/kueue: managed      # Kueue admits every queued job in this namespace
    # Pod Security Admission (tenant pods share the GPU nodes): the API never renders a privileged pod; the
    # admission controller proves it (baseline enforced: no privileged, hostPath, hostPID/network, added caps).
    # InfiniBand tenants stay at baseline: RDMA needs no capability on nodes whose container runtime has an
    # unlimited memlock limit (docs/JOBS.md "Multi-node runs").
    pod-security.kubernetes.io/enforce: baseline
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/audit: restricted
  annotations:
    {{- if .Values.allowedImages }}
    # image prefixes a container-run of this tenant may use (the API refuses others, services/api app.py)
    serverless2.nebius/allowed-images: {{ join "," .Values.allowedImages | quote }}
    {{- end }}
    # what a run may reference in its execution block (services/api/execution.py resolves against these, never raw names)
    serverless2.nebius/identities: {{ .Values.identities | toJson | quote }}
    serverless2.nebius/execution-profiles: {{ .Values.executionProfiles | toJson | quote }}
{{- if not $c.manager }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.runnerServiceAccount }}
  namespace: {{ include "tenant.ns" . }}
  labels:
    {{- include "tenant.labels" . | nindent 4 }}
{{- range $ref, $id := .Values.identities }}
---
# workload identity `{{ $ref }}`: the pod of a run with workload_identity_ref={{ $ref }} runs as this account; no Kubernetes
# permissions beyond the runner's (the uploader's pod lookup); its projected token (audience {{ $id.audience | quote }}) is what
# the run presents to a storage provider's OIDC federation
apiVersion: v1
kind: ServiceAccount
metadata:
  name: identity-{{ $ref }}
  namespace: {{ include "tenant.ns" $ }}
  labels:
    {{- include "tenant.labels" $ | nindent 4 }}
{{- end }}
{{- end }}
