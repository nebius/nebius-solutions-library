{{- if not .Values.name }}{{ fail "name is required" }}{{ end -}}
{{- $c := include "tenant.cluster" . | fromYaml -}}
apiVersion: v1
kind: Namespace
metadata:
  name: {{ include "tenant.ns" . }}
  labels:
    serverless2.nebius/kueue: managed      # Kueue admits every queued job in this namespace
    serverless2.nebius/tenant: {{ .Values.name }}
    # Pod Security Admission (tenant pods share the GPU nodes): the API never renders a privileged pod; the
    # admission controller proves it (baseline enforced: no privileged, hostPath, hostPID/network, added caps).
    # InfiniBand tenants stay at baseline: RDMA needs no capability on nodes whose container runtime has an
    # unlimited memlock limit (docs/JOBS.md "Multi-node runs").
    pod-security.kubernetes.io/enforce: baseline
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/audit: restricted
  {{- if .Values.allowedImages }}
  annotations:
    # image prefixes a container-run of this tenant may use (the API refuses others, services/api app.py)
    serverless2.nebius/allowed-images: {{ join "," .Values.allowedImages | quote }}
  {{- end }}
{{- if not $c.manager }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.runnerServiceAccount }}
  namespace: {{ include "tenant.ns" . }}
{{- if .Values.legacyRunnerServiceAccount }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.legacyRunnerServiceAccount }}
  namespace: {{ include "tenant.ns" . }}
{{- end }}
{{- end }}
