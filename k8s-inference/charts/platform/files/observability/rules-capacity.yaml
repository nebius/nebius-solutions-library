# Capacity alerts (readiness gap 7): Kueue admits against the ClusterQueue quota, but the node pool
# has a maximum and endpoints hold GPUs Kueue does not see. Both clusters.
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: serverless2-capacity
  namespace: monitoring
  labels: { release: kube-prometheus-stack }
spec:
  groups:
    - name: serverless2-capacity
      rules:
        - alert: RunPodPendingLong
          expr: |
            sum by (namespace) (kube_pod_status_phase{phase="Pending", namespace=~"tenant-.*"}) > 0
          for: 10m
          labels: { severity: warning, component: scheduling }
          annotations:
            summary: "Admitted run pods pending >10 min in {{ $labels.namespace }}"
            description: "Kueue admitted the workload but no node has a free GPU: the pool is at its maximum (fleet.yaml max_nodes), an endpoint holds the last GPU, or spot capacity is unavailable (recover-stopped-nodes logs in ops)."
        - alert: KueueWorkloadsPendingLong
          expr: sum by (cluster_queue) (kueue_pending_workloads) > 0
          for: 15m
          labels: { severity: warning, component: scheduling }
          annotations:
            summary: "Workloads waiting for quota in {{ $labels.cluster_queue }} for 15 min"
            description: "ClusterQueue quota exhausted (nominalQuota = pool max minus warm endpoints). Raise max_nodes + quota or wait for running work to finish."
