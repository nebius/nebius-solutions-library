{{- if index .Values.components "node-config" }}
# containerd registry mirror support on every node (docs/IMAGES.md). mk8s CPU node images ship containerd with
# `config_path = /etc/containerd/certs.d`; the GPU node images ship a config without it (measured on an
# L40S node: `version = 2`, imports from conf.d, no registry section), and containerd only reads this setting at
# start. This DaemonSet adds the setting once per node (a drop-in under conf.d when the config imports it, else
# appended) and restarts containerd through the host's systemd when the running process does not serve it (checked
# by a probe pull, not the file). It also lifts the runtime's memlock limit (systemd drop-in) so RDMA works in pods
# without CAP_IPC_LOCK (docs/JOBS.md "Multi-node runs"). The GPU node-group cloud-init writes the same drop-in at
# boot (`stack/modules/cluster`), so on a fresh GPU node this is a no-op; CPU (system) nodes get their configuration from
# this DaemonSet alone (and, since 0.1.12, from the cloud-init fragment the batch pools share with the GPU pools, so this
# is a no-op there too). A node that still lacks the mirror file for the logical host (created before that fragment) gets
# a bootstrap one here, pointing at the cache on the node's loopback, and never over a file Spegel already wrote.
# Running containers are unaffected (they belong to their shims); the kubelet reconnects. Spegel then writes
# the per-registry hosts.toml files that this setting makes containerd read.
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: containerd-registry-config
  namespace: spegel
  labels: { app.kubernetes.io/name: containerd-registry-config, app.kubernetes.io/part-of: serverless2 }
spec:
  selector:
    matchLabels: { app.kubernetes.io/name: containerd-registry-config }
  updateStrategy: { type: RollingUpdate, rollingUpdate: { maxUnavailable: 100% } }
  template:
    metadata:
      labels: { app.kubernetes.io/name: containerd-registry-config, app.kubernetes.io/part-of: serverless2 }
    spec:
      hostPID: true                       # nsenter into the host's systemd to restart containerd
      priorityClassName: system-node-critical
      tolerations: [{ operator: Exists }]
      terminationGracePeriodSeconds: 1
      initContainers:
        - name: configure
          image: docker.io/library/busybox:1.36
          securityContext: { privileged: true }
          volumeMounts: [{ name: host-root, mountPath: /host }]
          env:
            - { name: HOST_ROOT, value: /host }
            - { name: IMAGES_HOST, value: {{ .Values.images.host | quote }} }
            - { name: CACHE_NODE_PORT, value: {{ .Values.images.cacheNodePort | default 30500 | quote }} }
          # the script is a chart file (charts/platform/files/node-config.sh, tested by tools/node-config-test.sh)
          command: [sh, -c]
          args:
            - |
{{ .Files.Get "files/node-config.sh" | indent 14 }}
      containers:
        - name: pause
          image: registry.k8s.io/pause:3.10
          resources:
            requests: { cpu: 5m, memory: 8Mi }
            limits: { cpu: 10m, memory: 16Mi }
      volumes:
        - name: host-root
          hostPath: { path: / }
{{- end }}
