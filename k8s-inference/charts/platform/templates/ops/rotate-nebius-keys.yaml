{{- if and (index .Values.components "ops") .Values.ops.rotateKeys }}
# Credential rotation: the Nebius service-account auth keys this cluster holds (Secret ops/nebius-sa) regenerated
# weekly with the current key, the previous keys retired after 7 days (services/ops/bin/rotate-nebius-keys.sh).
# Off in the Terraform solution (values ops.rotateKeys: false): every key is a Terraform resource rotated with
# `-replace` (docs/OPERATIONS.md "Rotation and take-over"), and a CronJob that rewrote the Secret behind
# Terraform's back would be undone by the next apply. A fleet that wants in-cluster rotation sets ops.rotateKeys.
apiVersion: v1
kind: ServiceAccount
metadata: { name: key-rotator, namespace: ops }
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata: { name: key-rotator, namespace: ops }
rules:
  - apiGroups: [""]
    resources: [secrets]
    verbs: [get, patch]
    resourceNames: [nebius-sa]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: { name: key-rotator, namespace: ops }
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: Role, name: key-rotator }
subjects: [{ kind: ServiceAccount, name: key-rotator, namespace: ops }]
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: rotate-nebius-keys
  namespace: ops
spec:
  schedule: "20 4 * * 1"            # Mondays 04:20 UTC
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  startingDeadlineSeconds: 3600
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 600
      ttlSecondsAfterFinished: 604800
      template:
        metadata:
          labels: { app: rotate-nebius-keys }
        spec:
          restartPolicy: Never
          serviceAccountName: key-rotator
          securityContext: { runAsNonRoot: true, runAsUser: 10001, fsGroup: 10001 }
          containers:
            - name: rotate
              image: {{ .Values.images.ops }}
              args: [rotate-nebius-keys.sh]
              env:
                - { name: SECRETS, value: "nebius-sa" }
                - { name: RETIRE_AFTER_DAYS, value: "7" }
              volumeMounts:
                - { name: nebius-sa, mountPath: /var/run/nebius-sa, readOnly: true }
                - { name: nebius-sa, mountPath: /var/run/nebius, readOnly: true }   # ops-login.sh profiles
              resources:
                requests: { cpu: 50m, memory: 64Mi }
                limits: { cpu: 500m, memory: 256Mi }
          volumes:
            - name: nebius-sa
              secret: { secretName: nebius-sa, defaultMode: 288 }   # 0440: decimal, Terraform's yamldecode reads 0440 as 440
{{- end }}
