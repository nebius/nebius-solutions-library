{{- if index .Values.components "ops" }}
# Tenant isolation. Cilium is the CNI on Nebius Managed Kubernetes, so one cluster-wide policy covers
# every namespace labeled `serverless2.nebius/tenant` (present and future; nothing to add at onboarding).
# Ingress: only from the same namespace, the node (kubelet probes) and Prometheus. Egress: own namespace,
# DNS, the Kubernetes API (the uploader polls its own pod), the gateway (`envoy-gateway-system`: endpoint
# calls go through the gateway's hostname with the caller's key, exactly like an external client; the
# predictor Services in `models` and the Knative activator are NOT reachable from tenant pods, so no call
# can skip the key check, the rate limit or the accounting), and the world
# (tenant bucket, NGC, public endpoints), never another namespace in the cluster (other tenants, litellm,
# data, api, kube-system beyond DNS).
# Traffic inside one tenant namespace (multi-pod runs, JobSets) is not covered here: a cluster-wide policy
# cannot say "same namespace as mine", so charts/tenant renders the namespaced CiliumNetworkPolicy `tenant-local`
# per tenant at onboarding (docs/OPERATIONS.md "Tenant isolation").
apiVersion: cilium.io/v2
kind: CiliumClusterwideNetworkPolicy
metadata:
  name: tenant-isolation
spec:
  description: tenant namespaces talk to themselves, DNS, the API server, endpoints and the world only
  endpointSelector:
    matchExpressions:
      - { key: io.cilium.k8s.namespace.labels.serverless2.nebius/tenant, operator: Exists }
  ingress:
    - fromEntities: [host, remote-node]            # kubelet probes, node-local traffic
    - fromEndpoints:
        - matchLabels: { io.kubernetes.pod.namespace: monitoring, app.kubernetes.io/name: prometheus }
  egress:
    - toEndpoints:
        - matchLabels: { io.kubernetes.pod.namespace: kube-system, k8s-app: coredns }
      toPorts:
        - ports: [{ port: "53", protocol: UDP }, { port: "53", protocol: TCP }]
    - toEntities: [kube-apiserver]
    - toEndpoints:
        - matchLabels: { io.kubernetes.pod.namespace: envoy-gateway-system }
---
# The world (tenant bucket, NGC, public endpoints, a customer's storage) for every tenant pod EXCEPT one that runs under an
# execution profile (label serverless2.nebius/execution-profile, docs/JOBS.md "Execution options"): such a pod reaches
# only the destinations its profile's policy names (charts/tenant execution.yaml). Cilium policies are allow-lists
# that add up, so the restriction is "not selected here", not a deny rule.
# "The world" is every address outside the cluster EXCEPT the instance metadata service (169.254.0.0/16): a tenant
# container must never read the node's identity token there. A CIDR rule never matches cluster-internal endpoints
# (they have their own identities), so this does not widen access to other namespaces.
apiVersion: cilium.io/v2
kind: CiliumClusterwideNetworkPolicy
metadata:
  name: tenant-egress-world
spec:
  description: tenant pods without an execution profile may reach the world, never the instance metadata service
  endpointSelector:
    matchExpressions:
      - { key: io.cilium.k8s.namespace.labels.serverless2.nebius/tenant, operator: Exists }
      - { key: serverless2.nebius/execution-profile, operator: DoesNotExist }
  egress:
    - toCIDRSet:
        - { cidr: 0.0.0.0/0, except: [169.254.0.0/16] }
{{- end }}
