apiVersion: serving.kserve.io/v1beta1
kind: InferenceService
metadata:
  name: llm-example
  namespace: models
  labels:
    app.kubernetes.io/name: llm-example
    app.kubernetes.io/instance: llm-example
    app.kubernetes.io/part-of: serverless2
    serverless2.nebius/model: llm-example
    serverless2.nebius/protocol: openai
    kueue.x-k8s.io/priority-class: customer-batch
    serverless2.nebius/cluster: hub
    serverless2.nebius/mode: sync
    serverless2.nebius/task: text-generation
  annotations:
    serving.kserve.io/deploymentMode: Knative
    autoscaling.knative.dev/scale-to-zero-pod-retention-period: 2m
spec:
  predictor:
    minReplicas: 0
    maxReplicas: 1
    scaleMetric: concurrency
    scaleTarget: 4
    timeout: 600
    labels:
      kueue.x-k8s.io/priority-class: customer-batch
    priorityClassName: serverless2-interactive
    nodeSelector:
      serverless2.nebius/pool: h100-spot-1x
    tolerations:
    - effect: NoSchedule
      key: nvidia.com/gpu
      operator: Exists
    initContainers:
    - name: weights-prepare
      image: registry.serverless2.local/docker/library/busybox:1.36
      command:
      - sh
      - -c
      - mkdir -p /weights-root/llm-example && chmod 1777 /weights-root/llm-example
      securityContext:
        runAsUser: 0
      volumeMounts:
      - name: weights
        mountPath: /weights-root
      resources:
        requests:
          cpu: 10m
          memory: 16Mi
        limits:
          cpu: 100m
          memory: 64Mi
    containers:
    - name: kserve-container
      image: registry.serverless2.local/docker/vllm/vllm-openai:v0.11.0
      args:
      - --model
      - example-org/small-chat-model
      - --served-model-name
      - llm
      - --max-model-len
      - '4096'
      env:
      - name: HF_HOME
        value: /weights
      - name: HF_HUB_CACHE
        value: /weights/hub
      ports:
      - containerPort: 8000
        protocol: TCP
      resources:
        limits:
          nvidia.com/gpu: '1'
          cpu: '4'
          memory: 16Gi
        requests:
          nvidia.com/gpu: '1'
          cpu: '4'
          memory: 16Gi
      volumeMounts:
      - name: shm
        mountPath: /dev/shm
      - name: weights
        mountPath: /weights
        subPath: llm-example
        readOnly: false
    volumes:
    - name: shm
      emptyDir:
        medium: Memory
        sizeLimit: 4Gi
    - name: weights
      persistentVolumeClaim:
        claimName: weights-shared
---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: SecurityPolicy
metadata:
  name: llm-example-authorization
  namespace: models
  labels:
    app.kubernetes.io/name: llm-example
    app.kubernetes.io/instance: llm-example
    app.kubernetes.io/part-of: serverless2
    serverless2.nebius/model: llm-example
    serverless2.nebius/protocol: openai
    kueue.x-k8s.io/priority-class: customer-batch
    serverless2.nebius/cluster: hub
    serverless2.nebius/mode: sync
    serverless2.nebius/task: text-generation
spec:
  targetSelectors:
  - group: gateway.networking.k8s.io
    kind: HTTPRoute
    matchLabels:
      serving.knative.dev/route: llm-example-predictor
    matchExpressions:
    - key: networking.knative.dev/visibility
      operator: NotIn
      values:
      - cluster-local
  extAuth:
    failOpen: false
    timeout: 10s
    headersToExtAuth:
    - authorization
    - sec-websocket-protocol
    http:
      path: /internal/authorize/llm-example
      backendRefs:
      - group: ''
        kind: Service
        name: api
        namespace: api
        port: 80
      headersToBackend:
      - x-serverless2-tenant
      - x-serverless2-key-alias
