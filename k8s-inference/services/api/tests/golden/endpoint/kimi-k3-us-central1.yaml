apiVersion: v1
kind: Service
metadata:
  name: kimi-k3-predictor
  namespace: models
  labels:
    app.kubernetes.io/name: kimi-k3
    app.kubernetes.io/instance: kimi-k3
    app.kubernetes.io/part-of: serverless2
    serverless2.nebius/model: kimi-k3
    serverless2.nebius/protocol: openai
    kueue.x-k8s.io/priority-class: customer-batch
    serverless2.nebius/cluster: us-central1
    serverless2.nebius/mode: sync
    serverless2.nebius/task: custom
spec:
  type: ClusterIP
  selector:
    leaderworkerset.sigs.k8s.io/name: kimi-k3
    leaderworkerset.sigs.k8s.io/worker-index: '0'
  ports:
  - name: http
    port: 80
    targetPort: 8000
    protocol: TCP
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: kimi-k3-predictor
  namespace: models
  labels:
    app.kubernetes.io/name: kimi-k3
    app.kubernetes.io/instance: kimi-k3
    app.kubernetes.io/part-of: serverless2
    serverless2.nebius/model: kimi-k3
    serverless2.nebius/protocol: openai
    kueue.x-k8s.io/priority-class: customer-batch
    serverless2.nebius/cluster: us-central1
    serverless2.nebius/mode: sync
    serverless2.nebius/task: custom
    serving.knative.dev/route: kimi-k3-predictor
spec:
  parentRefs:
  - group: gateway.networking.k8s.io
    kind: Gateway
    name: serverless2-external
    namespace: envoy-gateway-system
  hostnames:
  - kimi-k3-predictor.models.203.0.113.1.sslip.io
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /
    backendRefs:
    - group: ''
      kind: Service
      name: kimi-k3-predictor
      port: 80
    timeouts:
      request: 0s
---
apiVersion: leaderworkerset.x-k8s.io/v1
kind: LeaderWorkerSet
metadata:
  name: kimi-k3
  namespace: models
  labels:
    app.kubernetes.io/name: kimi-k3
    app.kubernetes.io/instance: kimi-k3
    app.kubernetes.io/part-of: serverless2
    serverless2.nebius/model: kimi-k3
    serverless2.nebius/protocol: openai
    kueue.x-k8s.io/priority-class: customer-batch
    serverless2.nebius/cluster: us-central1
    serverless2.nebius/mode: sync
    serverless2.nebius/task: custom
  annotations:
    serverless2.nebius/nodes: '2'
    serverless2.nebius/interconnect: none
    serverless2.nebius/idle-s: '1800'
    autoscaling.knative.dev/target-utilization-percentage: '100'
    autoscaling.knative.dev/window: 30s
spec:
  replicas: 0
  startupPolicy: LeaderCreated
  leaderWorkerTemplate:
    size: 2
    restartPolicy: RecreateGroupOnPodRestart
    leaderTemplate:
      metadata:
        labels:
          app.kubernetes.io/name: kimi-k3
          app.kubernetes.io/part-of: serverless2
          serverless2.nebius/model: kimi-k3
          serverless2.nebius/protocol: openai
          serverless2.nebius/role: leader
      spec:
        nodeSelector:
          serverless2.nebius/pool: b200-ondemand-8x
        tolerations:
        - effect: NoSchedule
          key: nvidia.com/gpu
          operator: Exists
        initContainers:
        - name: weights-prepare
          image: registry.serverless2.local/docker/library/busybox:1.36
          command:
          - sh
          - -c
          - mkdir -p /weights-root/kimi-k3 && chmod 1777 /weights-root/kimi-k3
          securityContext:
            runAsUser: 0
          volumeMounts:
          - name: weights
            mountPath: /weights-root
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 64Mi
        containers:
        - name: endpoint
          image: registry.serverless2.local/docker/vllm/vllm-openai:v0.31.0
          command:
          - /bin/sh
          - -c
          - vllm serve /weights/kimi --tensor-parallel-size 8 --pipeline-parallel-size
            2
          env:
          - name: NODE_RANK
            valueFrom:
              fieldRef:
                fieldPath: metadata.labels['leaderworkerset.sigs.k8s.io/worker-index']
          - name: NNODES
            value: '2'
          - name: GPUS_PER_NODE
            value: '8'
          - name: WORLD_SIZE
            value: '16'
          - name: MASTER_ADDR
            value: kimi-k3-0.kimi-k3
          - name: MASTER_PORT
            value: '29500'
          - name: NCCL_SOCKET_IFNAME
            value: eth0
          - name: NCCL_IB_DISABLE
            value: '1'
          - name: HF_HOME
            value: /weights
          ports:
          - containerPort: 8000
            protocol: TCP
          resources:
            limits:
              nvidia.com/gpu: '8'
              cpu: '120'
              memory: 1500Gi
            requests:
              nvidia.com/gpu: '8'
              cpu: '120'
              memory: 1500Gi
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
          volumeMounts:
          - name: shm
            mountPath: /dev/shm
          - name: weights
            mountPath: /weights
            subPath: kimi-k3
            readOnly: false
        volumes:
        - name: shm
          emptyDir:
            medium: Memory
            sizeLimit: 32Gi
        - name: weights
          persistentVolumeClaim:
            claimName: weights-shared
    workerTemplate:
      metadata:
        labels:
          app.kubernetes.io/name: kimi-k3
          app.kubernetes.io/part-of: serverless2
          serverless2.nebius/model: kimi-k3
          serverless2.nebius/protocol: openai
          serverless2.nebius/role: worker
      spec:
        nodeSelector:
          serverless2.nebius/pool: b200-ondemand-8x
        tolerations:
        - effect: NoSchedule
          key: nvidia.com/gpu
          operator: Exists
        initContainers:
        - name: weights-prepare
          image: registry.serverless2.local/docker/library/busybox:1.36
          command:
          - sh
          - -c
          - mkdir -p /weights-root/kimi-k3 && chmod 1777 /weights-root/kimi-k3
          securityContext:
            runAsUser: 0
          volumeMounts:
          - name: weights
            mountPath: /weights-root
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 64Mi
        containers:
        - name: endpoint
          image: registry.serverless2.local/docker/vllm/vllm-openai:v0.31.0
          command:
          - /bin/sh
          - -c
          - ray start --address=$LWS_LEADER_ADDRESS:6379 --block
          env:
          - name: NODE_RANK
            valueFrom:
              fieldRef:
                fieldPath: metadata.labels['leaderworkerset.sigs.k8s.io/worker-index']
          - name: NNODES
            value: '2'
          - name: GPUS_PER_NODE
            value: '8'
          - name: WORLD_SIZE
            value: '16'
          - name: MASTER_ADDR
            value: kimi-k3-0.kimi-k3
          - name: MASTER_PORT
            value: '29500'
          - name: NCCL_SOCKET_IFNAME
            value: eth0
          - name: NCCL_IB_DISABLE
            value: '1'
          - name: HF_HOME
            value: /weights
          ports:
          - containerPort: 8000
            protocol: TCP
          resources:
            limits:
              nvidia.com/gpu: '8'
              cpu: '120'
              memory: 1500Gi
            requests:
              nvidia.com/gpu: '8'
              cpu: '120'
              memory: 1500Gi
          volumeMounts:
          - name: shm
            mountPath: /dev/shm
          - name: weights
            mountPath: /weights
            subPath: kimi-k3
            readOnly: false
        volumes:
        - name: shm
          emptyDir:
            medium: Memory
            sizeLimit: 32Gi
        - name: weights
          persistentVolumeClaim:
            claimName: weights-shared
---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: SecurityPolicy
metadata:
  name: kimi-k3-authorization
  namespace: models
  labels:
    app.kubernetes.io/name: kimi-k3
    app.kubernetes.io/instance: kimi-k3
    app.kubernetes.io/part-of: serverless2
    serverless2.nebius/model: kimi-k3
    serverless2.nebius/protocol: openai
    kueue.x-k8s.io/priority-class: customer-batch
    serverless2.nebius/cluster: us-central1
    serverless2.nebius/mode: sync
    serverless2.nebius/task: custom
spec:
  targetSelectors:
  - group: gateway.networking.k8s.io
    kind: HTTPRoute
    matchLabels:
      serving.knative.dev/route: kimi-k3-predictor
    matchExpressions:
    - key: networking.knative.dev/visibility
      operator: NotIn
      values:
      - cluster-local
  extAuth:
    failOpen: false
    timeout: 10s
    headersToExtAuth:
    - authorization
    - sec-websocket-protocol
    http:
      path: /internal/authorize/kimi-k3
      backendRefs:
      - group: gateway.envoyproxy.io
        kind: Backend
        name: api
        namespace: api
        port: 443
      headersToBackend:
      - x-serverless2-tenant
      - x-serverless2-key-alias
