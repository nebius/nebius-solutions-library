apiVersion: serving.kserve.io/v1beta1
kind: InferenceService
metadata:
  name: scaling-demo
  namespace: models
  labels:
    app.kubernetes.io/name: scaling-demo
    app.kubernetes.io/instance: scaling-demo
    app.kubernetes.io/part-of: serverless2
    serverless2.nebius/model: scaling-demo
    serverless2.nebius/protocol: http
    kueue.x-k8s.io/priority-class: customer-batch
    serverless2.nebius/cluster: hub
    serverless2.nebius/mode: sync
    serverless2.nebius/task: custom
  annotations:
    serving.kserve.io/deploymentMode: Knative
    autoscaling.knative.dev/scale-to-zero-pod-retention-period: 180s
    autoscaling.knative.dev/scale-down-delay: 30s
    autoscaling.knative.dev/target-utilization-percentage: '100'
    autoscaling.knative.dev/window: 20s
spec:
  predictor:
    minReplicas: 0
    maxReplicas: 4
    scaleMetric: rps
    scaleTarget: 100
    timeout: 600
    labels:
      kueue.x-k8s.io/priority-class: customer-batch
    nodeSelector:
      serverless2.nebius/pool: system
    tolerations:
    - effect: NoSchedule
      key: nvidia.com/gpu
      operator: Exists
    containers:
    - name: kserve-container
      image: registry.serverless2.local/docker/library/nginx:latest
      ports:
      - containerPort: 80
        protocol: TCP
      resources:
        limits:
          nvidia.com/gpu: '0'
          cpu: '4'
          memory: 16Gi
        requests:
          nvidia.com/gpu: '0'
          cpu: '4'
          memory: 16Gi
      volumeMounts:
      - name: shm
        mountPath: /dev/shm
    volumes:
    - name: shm
      emptyDir:
        medium: Memory
        sizeLimit: 1Gi
---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: SecurityPolicy
metadata:
  name: scaling-demo-authorization
  namespace: models
  labels:
    app.kubernetes.io/name: scaling-demo
    app.kubernetes.io/instance: scaling-demo
    app.kubernetes.io/part-of: serverless2
    serverless2.nebius/model: scaling-demo
    serverless2.nebius/protocol: http
    kueue.x-k8s.io/priority-class: customer-batch
    serverless2.nebius/cluster: hub
    serverless2.nebius/mode: sync
    serverless2.nebius/task: custom
spec:
  targetSelectors:
  - group: gateway.networking.k8s.io
    kind: HTTPRoute
    matchLabels:
      serving.knative.dev/route: scaling-demo-predictor
    matchExpressions:
    - key: networking.knative.dev/visibility
      operator: NotIn
      values:
      - cluster-local
  extAuth:
    failOpen: false
    timeout: 10s
    headersToExtAuth:
    - authorization
    - sec-websocket-protocol
    - x-serverless2-admitted
    http:
      path: /internal/authorize/scaling-demo
      backendRefs:
      - group: ''
        kind: Service
        name: api
        namespace: api
        port: 80
      headersToBackend:
      - x-serverless2-tenant
      - x-serverless2-key-alias
