apiVersion: serving.kserve.io/v1beta1
kind: InferenceService
metadata:
  name: my-llm
  namespace: models
  labels:
    app.kubernetes.io/name: my-llm
    app.kubernetes.io/instance: my-llm
    app.kubernetes.io/part-of: serverless2
    serverless2.nebius/model: my-llm
    serverless2.nebius/protocol: openai
    kueue.x-k8s.io/priority-class: customer-batch
    serverless2.nebius/cluster: hub
    serverless2.nebius/mode: sync
    serverless2.nebius/task: custom
  annotations:
    serving.kserve.io/deploymentMode: Knative
    autoscaling.knative.dev/scale-to-zero-pod-retention-period: 2m
    autoscaling.knative.dev/target-utilization-percentage: '100'
    autoscaling.knative.dev/window: 30s
spec:
  predictor:
    minReplicas: 0
    maxReplicas: 2
    scaleMetric: concurrency
    scaleTarget: 1
    containerConcurrency: 1
    timeout: 600
    labels:
      kueue.x-k8s.io/priority-class: customer-batch
    nodeSelector:
      serverless2.nebius/pool: h100-spot-1x
    tolerations:
    - effect: NoSchedule
      key: nvidia.com/gpu
      operator: Exists
    initContainers:
    - name: weights-prepare
      image: registry.serverless2.local/docker/library/busybox:1.36
      command:
      - sh
      - -c
      - mkdir -p /weights-root/my-llm && chmod 1777 /weights-root/my-llm
      securityContext:
        runAsUser: 0
      volumeMounts:
      - name: weights
        mountPath: /weights-root
      resources:
        requests:
          cpu: 10m
          memory: 16Mi
        limits:
          cpu: 100m
          memory: 64Mi
    containers:
    - name: kserve-container
      image: registry.serverless2.local/docker/vllm/vllm-openai:v0.11.0
      args:
      - --model
      - example-org/small-chat-model
      env:
      - name: HF_HOME
        value: /weights
      ports:
      - containerPort: 8000
        protocol: TCP
      resources:
        limits:
          nvidia.com/gpu: '1'
          cpu: '4'
          memory: 16Gi
        requests:
          nvidia.com/gpu: '1'
          cpu: '4'
          memory: 16Gi
      readinessProbe:
        httpGet:
          path: /health
          port: 8000
      volumeMounts:
      - name: shm
        mountPath: /dev/shm
      - name: weights
        mountPath: /weights
        subPath: my-llm
        readOnly: false
    volumes:
    - name: shm
      emptyDir:
        medium: Memory
        sizeLimit: 1Gi
    - name: weights
      persistentVolumeClaim:
        claimName: weights-shared
---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: SecurityPolicy
metadata:
  name: my-llm-authorization
  namespace: models
  labels:
    app.kubernetes.io/name: my-llm
    app.kubernetes.io/instance: my-llm
    app.kubernetes.io/part-of: serverless2
    serverless2.nebius/model: my-llm
    serverless2.nebius/protocol: openai
    kueue.x-k8s.io/priority-class: customer-batch
    serverless2.nebius/cluster: hub
    serverless2.nebius/mode: sync
    serverless2.nebius/task: custom
spec:
  targetSelectors:
  - group: gateway.networking.k8s.io
    kind: HTTPRoute
    matchLabels:
      serving.knative.dev/route: my-llm-predictor
    matchExpressions:
    - key: networking.knative.dev/visibility
      operator: NotIn
      values:
      - cluster-local
  extAuth:
    failOpen: false
    timeout: 10s
    headersToExtAuth:
    - authorization
    - sec-websocket-protocol
    http:
      path: /internal/authorize/my-llm
      backendRefs:
      - group: ''
        kind: Service
        name: api
        namespace: api
        port: 80
      headersToBackend:
      - x-serverless2-tenant
      - x-serverless2-key-alias
