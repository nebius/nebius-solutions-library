apiVersion: serving.kserve.io/v1beta1
kind: InferenceService
metadata:
  name: kueue-example
  namespace: models
  labels:
    app.kubernetes.io/name: kueue-example
    app.kubernetes.io/instance: kueue-example
    app.kubernetes.io/managed-by: Helm
    helm.sh/chart: endpoint-0.1.3
    app.kubernetes.io/part-of: serverless2
    serverless2.nebius/model: kueue-example
    serverless2.nebius/protocol: http
    kueue.x-k8s.io/priority-class: customer-batch
    serverless2.nebius/cluster: hub
    serverless2.nebius/mode: sync
    serverless2.nebius/task: inference
  annotations:
    serving.kserve.io/deploymentMode: Knative
    autoscaling.knative.dev/scale-to-zero-pod-retention-period: 2m
spec:
  predictor:
    minReplicas: 0
    maxReplicas: 1
    scaleMetric: concurrency
    scaleTarget: 1
    timeout: 600
    labels:
      kueue.x-k8s.io/queue-name: prefer-h100
      kueue.x-k8s.io/priority-class: customer-batch
    nodeSelector:
      example.org/zone: b
    tolerations:
    - effect: NoSchedule
      key: nvidia.com/gpu
      operator: Exists
    containers:
    - name: kserve-container
      image: registry.serverless2.local/docker/library/nginx:1.27
      ports:
      - containerPort: 80
        protocol: TCP
      resources:
        limits:
          nvidia.com/gpu: '1'
          cpu: '2'
          memory: 4Gi
        requests:
          nvidia.com/gpu: '1'
          cpu: '2'
          memory: 4Gi
      volumeMounts:
      - name: weights
        mountPath: /weights
        subPath: kueue-example
        readOnly: false
    volumes:
    - name: weights
      persistentVolumeClaim:
        claimName: weights-shared
---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: SecurityPolicy
metadata:
  name: kueue-example-authorization
  namespace: models
  labels:
    app.kubernetes.io/name: kueue-example
    app.kubernetes.io/instance: kueue-example
    app.kubernetes.io/managed-by: Helm
    helm.sh/chart: endpoint-0.1.3
    app.kubernetes.io/part-of: serverless2
    serverless2.nebius/model: kueue-example
    serverless2.nebius/protocol: http
    kueue.x-k8s.io/priority-class: customer-batch
    serverless2.nebius/cluster: hub
    serverless2.nebius/mode: sync
    serverless2.nebius/task: inference
spec:
  targetSelectors:
  - group: gateway.networking.k8s.io
    kind: HTTPRoute
    matchLabels:
      serving.knative.dev/route: kueue-example-predictor
    matchExpressions:
    - key: networking.knative.dev/visibility
      operator: NotIn
      values:
      - cluster-local
  extAuth:
    failOpen: false
    timeout: 10s
    headersToExtAuth:
    - authorization
    - sec-websocket-protocol
    http:
      path: /internal/authorize/kueue-example
      backendRefs:
      - group: ''
        kind: Service
        name: api
        namespace: api
        port: 80
      headersToBackend:
      - x-serverless2-tenant
      - x-serverless2-key-alias
