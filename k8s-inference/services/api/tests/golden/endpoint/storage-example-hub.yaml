apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: storage-example-index
  namespace: models
  labels:
    app.kubernetes.io/name: storage-example
    app.kubernetes.io/instance: storage-example
    app.kubernetes.io/part-of: serverless2
    serverless2.nebius/model: storage-example
    serverless2.nebius/protocol: http
    kueue.x-k8s.io/priority-class: science
    example.org/team: science
    serverless2.nebius/cluster: hub
    serverless2.nebius/mode: sync
    serverless2.nebius/task: inference
spec:
  accessModes:
  - ReadWriteOnce
  storageClassName: shared-rwx
  resources:
    requests:
      storage: 200Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: storage-example-state
  namespace: models
  labels:
    app.kubernetes.io/name: storage-example
    app.kubernetes.io/instance: storage-example
    app.kubernetes.io/part-of: serverless2
    serverless2.nebius/model: storage-example
    serverless2.nebius/protocol: http
    kueue.x-k8s.io/priority-class: science
    example.org/team: science
    serverless2.nebius/cluster: hub
    serverless2.nebius/mode: sync
    serverless2.nebius/task: inference
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
---
apiVersion: serving.kserve.io/v1beta1
kind: InferenceService
metadata:
  name: storage-example
  namespace: models
  labels:
    app.kubernetes.io/name: storage-example
    app.kubernetes.io/instance: storage-example
    app.kubernetes.io/part-of: serverless2
    serverless2.nebius/model: storage-example
    serverless2.nebius/protocol: http
    kueue.x-k8s.io/priority-class: science
    example.org/team: science
    serverless2.nebius/cluster: hub
    serverless2.nebius/mode: sync
    serverless2.nebius/task: inference
  annotations:
    serving.kserve.io/deploymentMode: Knative
    autoscaling.knative.dev/scale-to-zero-pod-retention-period: 5m
    autoscaling.knative.dev/window: 60s
    example.org/owner: ops
spec:
  predictor:
    minReplicas: 1
    maxReplicas: 3
    scaleMetric: rps
    scaleTarget: 10
    timeout: 120
    labels:
      kueue.x-k8s.io/priority-class: science
    priorityClassName: serverless2-interactive
    imagePullSecrets:
    - name: ngc
    nodeSelector:
      serverless2.nebius/pool: h100-spot-2x
      example.org/zone: a
    tolerations:
    - effect: NoSchedule
      key: example.org/dedicated
      operator: Exists
    securityContext:
      runAsUser: 1000
    initContainers:
    - name: weights-prepare
      image: registry.serverless2.local/docker/library/busybox:1.36
      command:
      - sh
      - -c
      - mkdir -p /weights-root/seeded/storage && chmod 1777 /weights-root/seeded/storage
      securityContext:
        runAsUser: 0
      volumeMounts:
      - name: weights
        mountPath: /weights-root
      resources:
        requests:
          cpu: 10m
          memory: 16Mi
        limits:
          cpu: 100m
          memory: 64Mi
    containers:
    - name: kserve-container
      image: registry.serverless2.local/nvcr/example/storage:1.0-h100
      command:
      - serve
      args:
      - --port
      - '9000'
      workingDir: /srv
      env:
      - name: LOG_LEVEL
        value: info
      - name: CACHE
        value: /scratch
      - name: MODEL_DIR
        value: /models
      envFrom:
      - secretRef:
          name: storage-keys
      ports:
      - containerPort: 9000
        protocol: TCP
      resources:
        limits:
          nvidia.com/gpu: '2'
          cpu: '16'
          memory: 64Gi
          ephemeral-storage: 100Gi
        requests:
          nvidia.com/gpu: '2'
          cpu: '16'
          memory: 64Gi
          ephemeral-storage: 100Gi
      readinessProbe:
        httpGet:
          path: /ready
          port: 9001
        periodSeconds: 5
        failureThreshold: 3
      livenessProbe:
        httpGet:
          path: /live
          port: 9000
        periodSeconds: 15
        failureThreshold: 4
        initialDelaySeconds: 60
      securityContext:
        readOnlyRootFilesystem: true
      volumeMounts:
      - name: shm
        mountPath: /dev/shm
      - name: weights
        mountPath: /models
        subPath: seeded/storage
        readOnly: true
      - name: scratch
        mountPath: /scratch
      - name: index
        mountPath: /index
      - name: state
        mountPath: /state
    volumes:
    - name: shm
      emptyDir:
        medium: Memory
        sizeLimit: 8Gi
    - name: weights
      persistentVolumeClaim:
        claimName: weights-ro
    - name: scratch
      emptyDir:
        sizeLimit: 20Gi
        medium: Memory
    - name: index
      persistentVolumeClaim:
        claimName: storage-example-index
    - name: state
      persistentVolumeClaim:
        claimName: storage-example-state
---
apiVersion: serving.kserve.io/v1alpha1
kind: LocalModelCache
metadata:
  name: storage-example
  labels:
    app.kubernetes.io/name: storage-example
    app.kubernetes.io/instance: storage-example
    app.kubernetes.io/part-of: serverless2
    serverless2.nebius/model: storage-example
    serverless2.nebius/protocol: http
    kueue.x-k8s.io/priority-class: science
    example.org/team: science
    serverless2.nebius/cluster: hub
    serverless2.nebius/mode: sync
    serverless2.nebius/task: inference
spec:
  sourceModelUri: s3://weights/storage-example
  modelSize: 120Gi
  nodeGroups:
  - h100
---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: SecurityPolicy
metadata:
  name: storage-example-authorization
  namespace: models
  labels:
    app.kubernetes.io/name: storage-example
    app.kubernetes.io/instance: storage-example
    app.kubernetes.io/part-of: serverless2
    serverless2.nebius/model: storage-example
    serverless2.nebius/protocol: http
    kueue.x-k8s.io/priority-class: science
    example.org/team: science
    serverless2.nebius/cluster: hub
    serverless2.nebius/mode: sync
    serverless2.nebius/task: inference
spec:
  targetSelectors:
  - group: gateway.networking.k8s.io
    kind: HTTPRoute
    matchLabels:
      serving.knative.dev/route: storage-example-predictor
    matchExpressions:
    - key: networking.knative.dev/visibility
      operator: NotIn
      values:
      - cluster-local
  extAuth:
    failOpen: false
    timeout: 10s
    headersToExtAuth:
    - authorization
    - sec-websocket-protocol
    - x-serverless2-admitted
    http:
      path: /internal/authorize/storage-example
      backendRefs:
      - group: ''
        kind: Service
        name: api
        namespace: api
        port: 80
      headersToBackend:
      - x-serverless2-tenant
      - x-serverless2-key-alias
