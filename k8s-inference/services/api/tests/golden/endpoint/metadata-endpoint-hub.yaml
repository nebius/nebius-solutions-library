apiVersion: serving.kserve.io/v1beta1
kind: InferenceService
metadata:
  name: metadata-endpoint
  namespace: models
  labels:
    app.kubernetes.io/name: metadata-endpoint
    app.kubernetes.io/instance: metadata-endpoint
    app.kubernetes.io/managed-by: Helm
    helm.sh/chart: endpoint-0.1.3
    app.kubernetes.io/part-of: serverless2
    serverless2.nebius/model: metadata-endpoint
    serverless2.nebius/protocol: http
    kueue.x-k8s.io/priority-class: customer-batch
    serverless2.nebius/cluster: hub
    serverless2.nebius/mode: sync
    serverless2.nebius/task: custom
  annotations:
    serving.kserve.io/deploymentMode: Knative
    autoscaling.knative.dev/scale-to-zero-pod-retention-period: 2m
    autoscaling.knative.dev/target-utilization-percentage: '100'
    autoscaling.knative.dev/window: 30s
spec:
  predictor:
    minReplicas: 0
    maxReplicas: 1
    scaleMetric: concurrency
    scaleTarget: 1
    containerConcurrency: 1
    timeout: 600
    labels:
      example.org/startup-profile: qualified-science
      kueue.x-k8s.io/priority-class: customer-batch
    annotations:
      example.org/qualification: evidence/model-immutable.json
    automountServiceAccountToken: false
    nodeSelector:
      serverless2.nebius/pool: h100-spot-1x
    tolerations:
    - effect: NoSchedule
      key: nvidia.com/gpu
      operator: Exists
    containers:
    - name: kserve-container
      image: example.org/model:1
      ports:
      - containerPort: 8080
        protocol: TCP
      resources:
        limits:
          nvidia.com/gpu: '1'
          cpu: '4'
          memory: 16Gi
        requests:
          nvidia.com/gpu: '1'
          cpu: '4'
          memory: 16Gi
      volumeMounts:
      - name: shm
        mountPath: /dev/shm
    volumes:
    - name: shm
      emptyDir:
        medium: Memory
        sizeLimit: 1Gi
---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: SecurityPolicy
metadata:
  name: metadata-endpoint-authorization
  namespace: models
  labels:
    app.kubernetes.io/name: metadata-endpoint
    app.kubernetes.io/instance: metadata-endpoint
    app.kubernetes.io/managed-by: Helm
    helm.sh/chart: endpoint-0.1.3
    app.kubernetes.io/part-of: serverless2
    serverless2.nebius/model: metadata-endpoint
    serverless2.nebius/protocol: http
    kueue.x-k8s.io/priority-class: customer-batch
    serverless2.nebius/cluster: hub
    serverless2.nebius/mode: sync
    serverless2.nebius/task: custom
spec:
  targetSelectors:
  - group: gateway.networking.k8s.io
    kind: HTTPRoute
    matchLabels:
      serving.knative.dev/route: metadata-endpoint-predictor
    matchExpressions:
    - key: networking.knative.dev/visibility
      operator: NotIn
      values:
      - cluster-local
  extAuth:
    failOpen: false
    timeout: 10s
    headersToExtAuth:
    - authorization
    - sec-websocket-protocol
    http:
      path: /internal/authorize/metadata-endpoint
      backendRefs:
      - group: ''
        kind: Service
        name: api
        namespace: api
        port: 80
      headersToBackend:
      - x-serverless2-tenant
      - x-serverless2-key-alias
