apiVersion: serving.kserve.io/v1beta1
kind: InferenceService
metadata:
  name: http-example
  namespace: models
  labels:
    app.kubernetes.io/name: http-example
    app.kubernetes.io/instance: http-example
    app.kubernetes.io/part-of: serverless2
    serverless2.nebius/model: http-example
    serverless2.nebius/protocol: http
    kueue.x-k8s.io/priority-class: customer-batch
    serverless2.nebius/cluster: hub
    serverless2.nebius/mode: sync
    serverless2.nebius/task: inference
  annotations:
    serving.kserve.io/deploymentMode: Knative
    autoscaling.knative.dev/scale-to-zero-pod-retention-period: 2m
spec:
  predictor:
    minReplicas: 0
    maxReplicas: 1
    scaleMetric: concurrency
    scaleTarget: 1
    containerConcurrency: 1
    timeout: 600
    labels:
      kueue.x-k8s.io/priority-class: customer-batch
    priorityClassName: serverless2-interactive
    nodeSelector:
      serverless2.nebius/pool: h100-spot-1x
    tolerations:
    - effect: NoSchedule
      key: nvidia.com/gpu
      operator: Exists
    initContainers:
    - name: weights-prepare
      image: registry.serverless2.local/docker/library/busybox:1.36
      command:
      - sh
      - -c
      - mkdir -p /weights-root/http-example && chmod 1777 /weights-root/http-example
      securityContext:
        runAsUser: 0
      volumeMounts:
      - name: weights
        mountPath: /weights-root
      resources:
        requests:
          cpu: 10m
          memory: 16Mi
        limits:
          cpu: 100m
          memory: 64Mi
    containers:
    - name: kserve-container
      image: registry.serverless2.local/nvcr/example/http-example:1.0.0
      command:
      - /usr/bin/python3
      - /usr/local/bin/start_server
      env:
      - name: EXAMPLE_API_KEY
        valueFrom:
          secretKeyRef:
            key: EXAMPLE_API_KEY
            name: example-api-key
      - name: EXAMPLE_CACHE_PATH
        value: /opt/example/.cache
      ports:
      - containerPort: 8000
        protocol: TCP
      resources:
        limits:
          nvidia.com/gpu: '1'
          cpu: '8'
          memory: 32Gi
        requests:
          nvidia.com/gpu: '1'
          cpu: '4'
          memory: 16Gi
      readinessProbe:
        httpGet:
          path: /v1/health/ready
          port: 8000
      volumeMounts:
      - name: shm
        mountPath: /dev/shm
      - name: weights
        mountPath: /opt/example/.cache
        subPath: http-example
        readOnly: false
    volumes:
    - name: shm
      emptyDir:
        medium: Memory
        sizeLimit: 4Gi
    - name: weights
      persistentVolumeClaim:
        claimName: weights-shared
---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: SecurityPolicy
metadata:
  name: http-example-authorization
  namespace: models
  labels:
    app.kubernetes.io/name: http-example
    app.kubernetes.io/instance: http-example
    app.kubernetes.io/part-of: serverless2
    serverless2.nebius/model: http-example
    serverless2.nebius/protocol: http
    kueue.x-k8s.io/priority-class: customer-batch
    serverless2.nebius/cluster: hub
    serverless2.nebius/mode: sync
    serverless2.nebius/task: inference
spec:
  targetSelectors:
  - group: gateway.networking.k8s.io
    kind: HTTPRoute
    matchLabels:
      serving.knative.dev/route: http-example-predictor
    matchExpressions:
    - key: networking.knative.dev/visibility
      operator: NotIn
      values:
      - cluster-local
  extAuth:
    failOpen: false
    timeout: 10s
    headersToExtAuth:
    - authorization
    - sec-websocket-protocol
    - x-serverless2-admitted
    http:
      path: /internal/authorize/http-example
      backendRefs:
      - group: ''
        kind: Service
        name: api
        namespace: api
        port: 80
      headersToBackend:
      - x-serverless2-tenant
      - x-serverless2-key-alias
