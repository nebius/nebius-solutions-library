# Test fixture: an HTTP endpoint from a private registry image (NIM-like: pull through the cache, a model cache on
# the shared filesystem, a per-call price, one GPU class), written as the spec of docs/API.md "Models" plus its
# placement (`deployments`) and the catalog's display fields.
id: http-example
kind: endpoint
display_name: HTTP example (private registry image)
task: inference
protocol: http
port: 8000
path: /v1/generate
health_path: /v1/health/ready
gpu: { count: 1, classes: [h100] }
image: registry.serverless2.local/nvcr/example/http-example:1.0.0   # a private registry through the regional cache (docs/IMAGES.md); no pull secret on the pod
command: [/usr/bin/python3, /usr/local/bin/start_server]
env: { EXAMPLE_CACHE_PATH: /opt/example/.cache }
env_secrets: [example-api-key]   # EXAMPLE_API_KEY from the Secret of the models namespace
resources: { cpu: "8", memory: 32Gi }
scaling: { min: 0, max: 1, container_concurrency: 1 }
timeout_s: 600                   # also the pod's termination grace period in Knative
shm_gib: 4
weights:
  path: http-example
  mount_path: /opt/example/.cache
price: { unit: call, usd: 0.05 }
cold_start_class: slow           # 15 GiB image; model cache on the shared filesystem after the first start

deployments:
  hub:
    pool: h100-spot-1x
