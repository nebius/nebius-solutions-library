# Test fixture: an OpenAI-protocol endpoint (a stock vLLM container serving a small open model), written as the
# spec of docs/API.md "Models" plus its placement (`deployments`) and the catalog's display fields.
id: llm-example
kind: endpoint
display_name: LLM example (vLLM)
task: text-generation
protocol: openai                 # /v1/chat/completions, /v1/completions
port: 8000
path: /openai/v1/chat/completions
health_path: /health
served_model: llm                # the name the server registers (`--served-model-name`); injected into requests that omit `model`
gpu: { count: 1, classes: [h100, rtx-pro-6000] }
image: registry.serverless2.local/docker/vllm/vllm-openai:v0.11.0
args: ["--model", "example-org/small-chat-model", "--served-model-name", "llm", "--max-model-len", "4096"]
resources: { cpu: "4", memory: 16Gi }
scaling: { min: 0, max: 1, container_concurrency: 4 }
timeout_s: 600
shm_gib: 4
# Hugging Face cache on the region's shared filesystem: weights download once, every cold start after
# that is warm (PVC weights-shared, subPath llm-example, mounted at /weights; HF_HOME points there).
weights:
  path: llm-example
  mount_path: /weights
  env: { HF_HOME: /weights, HF_HUB_CACHE: /weights/hub }
price: { unit: 1k-tokens, usd: 0.0002 }
cold_start_class: slow           # weights downloaded at start unless cached on the shared filesystem

deployments:
  hub:
    pool: h100-spot-1x
  eu-south1:
    pool: rtx6000-spot-1x
