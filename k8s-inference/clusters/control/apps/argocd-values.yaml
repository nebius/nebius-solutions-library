# Values of the fleet Argo CD on the control cluster (clusters/control/apps/bootstrap.sh). It manages every
# cluster of fleet.yaml through cluster Secrets (clusters/fleet/root); the regional Argo CDs are retired after
# the cut-over (docs/CONTROL-PLANE.md).
configs:
  params:
    server.insecure: true      # TLS terminates at the Envoy gateway
  cm:
    # Tracking by annotation (the default since Argo CD 3; explicit because adoption of the hub's resources
    # depends on it: their argocd.argoproj.io/tracking-id values stay valid under the same Application names).
    application.resourceTrackingMethod: annotation
    # Gateway API objects get server-side defaults (group/kind/weight/matches,
    # listener defaults) that are not in git; ignore them instead of flapping.
    resource.customizations.ignoreDifferences.gateway.networking.k8s.io_HTTPRoute: |
      jqPathExpressions:
        - .spec.parentRefs[].group
        - .spec.parentRefs[].kind
        - .spec.rules[].backendRefs[].group
        - .spec.rules[].backendRefs[].kind
        - .spec.rules[].backendRefs[].weight
        - .spec.rules[].matches
    resource.customizations.ignoreDifferences.gateway.networking.k8s.io_Gateway: |
      jqPathExpressions:
        - .spec.listeners[].allowedRoutes
        - .spec.listeners[].tls?.mode
        - .spec.listeners[].tls?.certificateRefs[]?.group
        - .spec.listeners[].tls?.certificateRefs[]?.kind
    resource.customizations.ignoreDifferences.apiextensions.k8s.io_CustomResourceDefinition: |
      jsonPointers:
        - /metadata/annotations
        - /spec/conversion
    # KServe InferenceService health from its Ready condition. Argo CD's built-in check reads
    # status.modelStatus.transitionStatus, which KServe sets to InProgress whenever it reconciles an endpoint
    # that has no pod (every scale-to-zero endpoint, measured 2026-10-07: diffdock and nemotron Ready=True yet
    # "Progressing" for hours), so scaled-to-zero endpoints showed as Progressing forever.
    resource.customizations.health.serving.kserve.io_InferenceService: |
      hs = { status = "Progressing", message = "waiting for the Ready condition" }
      if obj.status ~= nil and obj.status.conditions ~= nil then
        for _, c in ipairs(obj.status.conditions) do
          if c.type == "Ready" then
            if c.status == "True" then
              hs.status = "Healthy"
              hs.message = "Ready (scaled-to-zero endpoints stay Ready)"
            elseif c.status == "False" and c.reason ~= nil and c.reason ~= "" then
              hs.status = "Degraded"
              hs.message = c.reason .. ": " .. (c.message or "")
            else
              hs.message = c.message or hs.message
            end
          end
        end
      end
      if obj.status ~= nil and obj.status.modelStatus ~= nil and obj.status.modelStatus.transitionStatus == "BlockedByFailedLoad" then
        hs.status = "Degraded"
        hs.message = "model load failed: " .. ((obj.status.modelStatus.lastFailureInfo or {}).reason or "")
      end
      return hs
controller:
  # Three clusters' resource caches (the hub's Knative/KServe/Kueue objects included): the controller was
  # OOM-killed at 2Gi while adopting eu-south1 on 2026-10-07; the system nodes have 32 GiB.
  resources:
    requests: { cpu: 500m, memory: 3Gi }
    limits: { cpu: "2", memory: 6Gi }
repoServer:
  replicas: 2
  resources:
    requests: { cpu: 200m, memory: 512Mi }
    limits: { cpu: "2", memory: 2Gi }
