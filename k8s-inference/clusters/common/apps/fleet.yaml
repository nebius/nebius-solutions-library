# charts/fleet renders this cluster's view of fleet.yaml: Kueue flavors and profile queues, pre-pull DaemonSets,
# fleet-prices; on the control cluster the MultiKueue objects (docs/FLEET.md). It owns the objects that
# clusters/<cluster>/apps/overlays/scheduling/pool.yaml and overlays/edge/prepull*.yaml held before.
name: fleet
component: fleet
namespace: kueue-system
wave: '1'
hubOnly: 'false'
placement: all
kind: localhelm
chart: charts/fleet
