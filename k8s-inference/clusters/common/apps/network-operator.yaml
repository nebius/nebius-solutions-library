# NVIDIA Network Operator (Nebius marketplace build): the DOCA/OFED drivers for the nodes' Mellanox NICs, installed
# BEFORE the GPU Operator (wave 0, the order the Nebius documentation requires) on clusters with an InfiniBand or
# B200 pool when the fleet runs the GPU Operator (terraform.tfvars gpu_operator, stack/platform/stage.tf
# app_enabled); nodes with the Managed Kubernetes driver image carry the drivers already and are left alone.
name: network-operator
component: network-operator
namespace: nvidia-network-operator
wave: '0'
hubOnly: 'false'
placement: worker
kind: helm
repoURL: cr.eu-north1.nebius.cloud/marketplace/nebius/nvidia-network-operator/chart
chart: network-operator
version: 25.7.0
helmValues: 'true'
