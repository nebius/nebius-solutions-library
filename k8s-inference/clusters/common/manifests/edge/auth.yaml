# Rendered by spikes/S15-edge/render.py (do not edit): LiteLLM key check on the external predictor hosts.
# Shared base with the hub's LiteLLM address; clusters/eu-south1/apps/overlays/edge/ patches LITELLM_URL and LITELLM_TLS_VERIFY.
apiVersion: v1
kind: ConfigMap
metadata:
  name: edge-auth
  namespace: models
  labels:
    app.kubernetes.io/name: edge-auth
    app.kubernetes.io/part-of: serverless2
data:
  edge_auth.py: "#!/usr/bin/env python3\n\"\"\"Envoy Gateway ext-auth for the model predictor hosts (lane H, known issue 9).\n\nEvery request that Envoy sends here carries the original method, path (with\
    \ query string) and the\nheaders listed in the SecurityPolicy. The key is taken from, in order:\n  Authorization: Bearer <litellm key>            (curl, SDKs, non-browser WebSocket clients)\n  ?api_key=<litellm\
    \ key>                         (browser WebSocket: no custom headers possible)\n  Sec-WebSocket-Protocol: bearer.<key> | <sk-..> (browser alternative; the backend must echo a protocol)\nThe key is validated\
    \ by asking LiteLLM for its own info (GET /key/info with that key): LiteLLM's auth\nrejects unknown, blocked, expired and over-budget keys, so no master key is needed here. Decisions are\ncached per\
    \ key hash (OK_TTL / BAD_TTL seconds). 200 adds x-serverless2-tenant / -key-alias for the\nbackend; 401 = missing or unknown key; 403 = key refused (blocked, budget); 503 = LiteLLM unreachable\n(fail\
    \ closed). Stdlib only: runs from a ConfigMap on a public python image.\n\"\"\"\nimport hashlib, json, logging, os, ssl, sys, threading, time, urllib.error, urllib.parse, urllib.request\nfrom http.server\
    \ import BaseHTTPRequestHandler, ThreadingHTTPServer\n\nLITELLM = os.environ.get(\"LITELLM_URL\", \"http://litellm.litellm.svc:4000\").rstrip(\"/\")\nOK_TTL = float(os.environ.get(\"OK_TTL\", \"30\"\
    ))\nBAD_TTL = float(os.environ.get(\"BAD_TTL\", \"10\"))\nTIMEOUT = float(os.environ.get(\"LITELLM_TIMEOUT\", \"8\"))\nCTX = ssl.create_default_context()\nif os.environ.get(\"LITELLM_TLS_VERIFY\", \"\
    true\").lower() == \"false\":   # self-signed sslip.io cert on the hub\n    CTX.check_hostname, CTX.verify_mode = False, ssl.CERT_NONE\nCACHE, LOCK = {}, threading.Lock()\nlog = logging.getLogger(\"\
    edge-auth\")\nlogging.basicConfig(stream=sys.stdout, level=logging.INFO, format=\"%(asctime)s %(message)s\")\n\n\ndef extract_key(headers, path):\n    auth = headers.get(\"authorization\", \"\")\n \
    \   if auth[:7].lower() == \"bearer \" and auth[7:].strip():\n        return auth[7:].strip(), \"header\"\n    qs = urllib.parse.parse_qs(urllib.parse.urlsplit(path).query)\n    if qs.get(\"api_key\"\
    , [\"\"])[0]:\n        return qs[\"api_key\"][0], \"query\"\n    for proto in headers.get(\"sec-websocket-protocol\", \"\").split(\",\"):\n        proto = proto.strip()\n        if proto.startswith(\"\
    bearer.\"):\n            return proto[7:], \"subprotocol\"\n        if proto.startswith(\"sk-\"):\n            return proto, \"subprotocol\"\n    return \"\", \"\"\n\n\ndef check(key):\n    \"\"\"->\
    \ (status, extra headers). Cached.\"\"\"\n    kh = hashlib.sha256(key.encode()).hexdigest()\n    now = time.monotonic()\n    with LOCK:\n        hit = CACHE.get(kh)\n        if hit and hit[2] > now:\n\
    \            return hit[0], hit[1]\n        if len(CACHE) > 10000:\n            CACHE.clear()\n    req = urllib.request.Request(LITELLM + \"/key/info\", headers={\"Authorization\": \"Bearer \" + key})\n\
    \    try:\n        with urllib.request.urlopen(req, timeout=TIMEOUT, context=CTX) as r:\n            info = json.load(r).get(\"info\") or {}\n        md = info.get(\"metadata\") or {}\n        res =\
    \ (200, {\"x-serverless2-tenant\": str(md.get(\"tenant\") or \"\"),\n                     \"x-serverless2-key-alias\": str(info.get(\"key_alias\") or \"\")})\n    except urllib.error.HTTPError as e:\n\
    \        res = (401, {}) if e.code in (401, 404) else (403, {\"x-serverless2-reason\": f\"litellm {e.code}\"})\n    except Exception as e:  # LiteLLM down: fail closed, do not cache\n        log.warning(\"\
    litellm unreachable: %s\", e)\n        return 503, {}\n    with LOCK:\n        CACHE[kh] = (res[0], res[1], now + (OK_TTL if res[0] == 200 else BAD_TTL))\n    return res\n\n\nclass Handler(BaseHTTPRequestHandler):\n\
    \    protocol_version = \"HTTP/1.1\"\n\n    def log_message(self, *_):  # one structured line per decision instead\n        pass\n\n    def _reply(self, status, headers=None, body=b\"\"):\n        self.send_response(status)\n\
    \        for k, v in (headers or {}).items():\n            self.send_header(k, v)\n        self.send_header(\"Content-Type\", \"application/json\")\n        self.send_header(\"Content-Length\", str(len(body)))\n\
    \        self.end_headers()\n        self.wfile.write(body)\n\n    def do_ANY(self):\n        if self.path == \"/healthz\":\n            return self._reply(200, body=b'{\"ok\":true}')\n        if \"\
    content-length\" in self.headers:  # the body is never forwarded here, but drain if it is\n            self.rfile.read(int(self.headers[\"content-length\"]))\n        key, src = extract_key(self.headers,\
    \ self.path)\n        host = self.headers.get(\"x-forwarded-host\") or self.headers.get(\"host\", \"\")\n        if not key:\n            log.info(\"401 missing host=%s path=%s\", host, self.path.split(\"\
    ?\")[0])\n            return self._reply(401, {\"WWW-Authenticate\": 'Bearer realm=\"serverless2\"'},\n                               b'{\"error\":\"missing api key: Authorization: Bearer <key>, ?api_key=\
    \ or Sec-WebSocket-Protocol bearer.<key>\"}')\n        status, extra = check(key)\n        log.info(\"%s %s host=%s path=%s tenant=%s\", status, src, host, self.path.split(\"?\")[0], extra.get(\"x-serverless2-tenant\"\
    , \"-\"))\n        if status == 200:\n            return self._reply(200, extra)\n        if status == 401:\n            return self._reply(401, {\"WWW-Authenticate\": 'Bearer error=\"invalid_token\"\
    '}, b'{\"error\":\"unknown api key\"}')\n        if status == 403:\n            return self._reply(403, extra, b'{\"error\":\"api key refused (blocked, expired or over budget)\"}')\n        return self._reply(503,\
    \ body=b'{\"error\":\"key service unavailable\"}')\n\n    do_GET = do_POST = do_PUT = do_DELETE = do_PATCH = do_OPTIONS = do_HEAD = do_ANY\n\n\nif __name__ == \"__main__\":\n    srv = ThreadingHTTPServer((\"\
    0.0.0.0\", int(os.environ.get(\"PORT\", \"9001\"))), Handler)\n    srv.daemon_threads = True\n    log.info(\"edge-auth listening on %s, litellm %s\", srv.server_address, LITELLM)\n    srv.serve_forever()\n"

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: edge-auth
  namespace: models
  labels: &id001
    app.kubernetes.io/name: edge-auth
    app.kubernetes.io/part-of: serverless2
spec:
  replicas: 2
  selector:
    matchLabels: *id001
  template:
    metadata:
      labels: *id001
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
      containers:
      - name: auth
        image: docker.io/library/python:3.12-alpine
        command:
        - python3
        - -u
        - /app/edge_auth.py
        env:
        - name: LITELLM_URL
          value: http://litellm.litellm.svc:4000
        - name: LITELLM_TLS_VERIFY
          value: 'true'
        - name: OK_TTL
          value: '30'
        - name: BAD_TTL
          value: '10'
        ports:
        - name: http
          containerPort: 9001
        readinessProbe:
          httpGet:
            path: /healthz
            port: 9001
          periodSeconds: 5
        livenessProbe:
          httpGet:
            path: /healthz
            port: 9001
          periodSeconds: 20
        resources:
          requests:
            cpu: 20m
            memory: 32Mi
          limits:
            cpu: 500m
            memory: 128Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
        volumeMounts:
        - name: app
          mountPath: /app
          readOnly: true
      volumes:
      - name: app
        configMap:
          name: edge-auth

---
apiVersion: v1
kind: Service
metadata:
  name: edge-auth
  namespace: models
  labels: &id001
    app.kubernetes.io/name: edge-auth
    app.kubernetes.io/part-of: serverless2
spec:
  selector: *id001
  ports:
  - name: http
    port: 9001
    targetPort: 9001

---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: SecurityPolicy
metadata:
  name: model-key-check
  namespace: models
  labels:
    app.kubernetes.io/name: edge-auth
    app.kubernetes.io/part-of: serverless2
spec:
  targetSelectors:
  - group: gateway.networking.k8s.io
    kind: HTTPRoute
    matchExpressions:
    - key: serving.knative.dev/route
      operator: Exists
    - key: networking.knative.dev/visibility
      operator: NotIn
      values:
      - cluster-local
  extAuth:
    failOpen: false
    timeout: 10s
    headersToExtAuth:
    - authorization
    - sec-websocket-protocol
    - x-forwarded-host
    - x-forwarded-for
    - user-agent
    http:
      backendRefs:
      - group: ''
        kind: Service
        name: edge-auth
        namespace: models
        port: 9001
      path: /check
      headersToBackend:
      - x-serverless2-tenant
      - x-serverless2-key-alias

