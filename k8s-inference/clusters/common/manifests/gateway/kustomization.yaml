# The `gateway` component; the platform stage (stack/platform/stage.tf) patches the cluster-specific parts.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - gateway.yaml
  - acme.yaml
  - models-tls.yaml
  - redis.yaml
  - ratelimit.yaml
patches:
  - path: envoyproxy-ha.yaml
