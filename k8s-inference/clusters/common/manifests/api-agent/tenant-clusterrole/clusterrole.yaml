# What the API identity may do inside a tenant namespace. Bound per namespace by a RoleBinding that
# charts/tenant renders at onboarding (subjects: the `api` ServiceAccount of this cluster's API and the
# `api-agent` ServiceAccount the control cluster's API uses here); never cluster-wide. Shared by the worker
# clusters (api-agent kustomization) and the control cluster (api overlay), where the fleet API creates the
# manager Jobs of fleet-placed runs and reads their Kueue Workloads to learn the worker.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata: { name: serverless2-api-tenant }
rules:
  - apiGroups: [batch]                    # operations are Jobs (docs/JOBS.md): submit, read, cancel (patch/delete), resume (create)
    resources: [jobs]
    verbs: [create, get, list, watch, patch, delete]
  - apiGroups: [jobset.x-k8s.io]          # multi-node runs are JobSets (docs/JOBS.md "Multi-node runs")
    resources: [jobsets]
    verbs: [create, get, list, watch, patch, delete]
  - apiGroups: [""]                       # attempts and GPU-seconds come from the Job's pods
    resources: [pods]
    verbs: [get, list]
  - apiGroups: [""]
    resources: [pods/log]
    verbs: [get]
  - apiGroups: [""]                       # one work volume per run (checkpoints; resumed on the same volume; released by the
    resources: [persistentvolumeclaims]   # uploader on success or by the billing pass when the uploader was preempted)
    verbs: [create, get, patch, delete]
  - apiGroups: [""]                       # endpoint-call jobs get their caller's key through a per-operation Secret (owned by the Job)
    resources: [secrets]
    verbs: [create]
  - apiGroups: [""]
    resources: [secrets]
    verbs: [get]
    resourceNames: [tenant-storage]
  - apiGroups: [kueue.x-k8s.io]           # fleet placement: the Workload of a manager Job names the worker that admitted it
    resources: [workloads]
    verbs: [get, list]
