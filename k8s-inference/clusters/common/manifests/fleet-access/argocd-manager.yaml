# The fleet Argo CD (control cluster) manages this cluster with this ServiceAccount: the same shape
# `argocd cluster add` creates (cluster-admin), declared here so every worker has it from git. No token
# Secret: the control cluster mints 48 h TokenRequest tokens (clusters/control/apps/bootstrap.sh register,
# then daily ops/rotate-fleet-tokens).
apiVersion: v1
kind: ServiceAccount
metadata: { name: argocd-manager, namespace: kube-system }
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata: { name: argocd-manager }
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: cluster-admin }
subjects: [{ kind: ServiceAccount, name: argocd-manager, namespace: kube-system }]
