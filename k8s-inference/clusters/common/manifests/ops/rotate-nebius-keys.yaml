# Credential rotation (gap 3): the Nebius service-account auth keys this cluster holds (Secret
# ops/nebius-sa; a cluster that holds other projects' keys lists them too) are regenerated weekly with
# the current key and the previous keys are retired after 7 days. Overlays set SECRETS, mount the extra
# Secrets and widen the Role's resourceNames to them
# (BACKUP_S3_SECRET=<ns>/<name> would also rotate an S3 key of the first SA; unused since the managed
# PostgreSQL replaced CloudNativePG, 2026-10-09).
# Script: services/ops/bin/rotate-nebius-keys.sh (ops image). Needs only the Nebius API plus
# patch rights on those Secrets.
apiVersion: v1
kind: ServiceAccount
metadata: { name: key-rotator, namespace: ops }
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata: { name: key-rotator, namespace: ops }
rules:
  - apiGroups: [""]
    resources: [secrets]
    verbs: [get, patch]
    resourceNames: [nebius-sa]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: { name: key-rotator, namespace: ops }
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: Role, name: key-rotator }
subjects: [{ kind: ServiceAccount, name: key-rotator, namespace: ops }]
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: rotate-nebius-keys
  namespace: ops
spec:
  schedule: "20 4 * * 1"            # Mondays 04:20 UTC
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  startingDeadlineSeconds: 3600
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 600
      ttlSecondsAfterFinished: 604800
      template:
        metadata:
          labels: { app: rotate-nebius-keys }
        spec:
          restartPolicy: Never
          serviceAccountName: key-rotator
          securityContext: { runAsNonRoot: true, runAsUser: 10001, fsGroup: 10001 }
          containers:
            - name: rotate
              image: registry.serverless2.local/nebius/serverless2/ops:0.1.10
              args: [rotate-nebius-keys.sh]
              env:
                - { name: SECRETS, value: "nebius-sa" }
                - { name: RETIRE_AFTER_DAYS, value: "7" }
              volumeMounts:
                - { name: nebius-sa, mountPath: /var/run/nebius-sa, readOnly: true }
                - { name: nebius-sa, mountPath: /var/run/nebius, readOnly: true }   # ops-login.sh profiles
              resources:
                requests: { cpu: 50m, memory: 64Mi }
                limits: { cpu: 500m, memory: 256Mi }
          volumes:
            - name: nebius-sa
              secret: { secretName: nebius-sa, defaultMode: 0440 }
