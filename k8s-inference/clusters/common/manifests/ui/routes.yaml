# Operator UIs on the external gateway (HTTPS listener). Shared base with the hub hostnames; the per-cluster
# overlays in clusters/<cluster>/apps/overlays/ui/ patch them: Grafana on every cluster, the fleet Argo CD and
# LiteLLM on the control cluster only (its overlay adds the LiteLLM route and the Argo CD route's hostname; the
# workers drop the Argo CD route). Each UI has its own login.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata: { name: ui-argocd, namespace: argocd }
spec:
  parentRefs: [{ name: serverless2-external, namespace: envoy-gateway-system, sectionName: https }]
  hostnames: ["argocd.example.invalid"]   # placeholder, set per cluster (stack/platform/stage.tf or the overlay)
  rules:
    - backendRefs: [{ name: argocd-server, port: 80 }]
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata: { name: ui-grafana, namespace: monitoring }
spec:
  parentRefs: [{ name: serverless2-external, namespace: envoy-gateway-system, sectionName: https }]
  hostnames: ["grafana.example.invalid"]   # placeholder, set per cluster
  rules:
    - backendRefs: [{ name: kube-prometheus-stack-grafana, port: 80 }]
