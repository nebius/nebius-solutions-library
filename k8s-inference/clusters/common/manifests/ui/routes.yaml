# Operator Grafana route; the control platform also installs the LiteLLM and console routes.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: ui-grafana
  namespace: monitoring
spec:
  parentRefs:
  - name: serverless2-external
    namespace: envoy-gateway-system
    sectionName: https
  hostnames:
  - grafana.example.invalid
  rules:
  - backendRefs:
    - name: kube-prometheus-stack-grafana
      port: 80
