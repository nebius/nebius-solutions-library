apiVersion: v1
kind: ConfigMap
metadata:
  name: serverless2-dashboard-platform
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
  annotations:
    serverless2.nebius/generated-by: spikes/S14-observability/gen_dashboards.py
data:
  serverless2-platform.json: |
    {
     "uid": "s2-platform",
     "title": "Serverless 2.0 / Platform",
     "description": "Pools, nodes, GPUs, scheduling pressure and the SLO numbers for this cluster.",
     "tags": [
      "serverless2"
     ],
     "timezone": "utc",
     "editable": true,
     "graphTooltip": 1,
     "refresh": "30s",
     "schemaVersion": 39,
     "version": 1,
     "time": {
      "from": "now-6h",
      "to": "now"
     },
     "templating": {
      "list": []
     },
     "panels": [
      {
       "id": 1,
       "type": "row",
       "title": "Pools and nodes",
       "collapsed": false,
       "gridPos": {
        "x": 0,
        "y": 0,
        "w": 24,
        "h": 1
       },
       "panels": []
      },
      {
       "id": 2,
       "type": "stat",
       "title": "Nodes per pool",
       "description": "Node objects per spot pool (serverless2.nebius/pool label). Preempted spot VMs keep their Node for a while.",
       "datasource": {
        "type": "prometheus",
        "uid": "prometheus"
       },
       "targets": [
        {
         "refId": "A",
         "datasource": {
          "type": "prometheus",
          "uid": "prometheus"
         },
         "expr": "serverless2:nodes:count_by_pool",
         "legendFormat": "{{pool}}",
         "instant": true,
         "range": false
        }
       ],
       "fieldConfig": {
        "defaults": {
         "unit": "short",
         "color": {
          "mode": "thresholds"
         },
         "thresholds": {
          "mode": "absolute",
          "steps": [
           {
            "color": "blue",
            "value": null
           }
          ]
         }
        },
        "overrides": []
       },
       "options": {
        "reduceOptions": {
         "calcs": [
          "lastNotNull"
         ],
         "fields": "",
         "values": false
        },
        "textMode": "value_and_name",
        "colorMode": "value",
        "graphMode": "none",
        "justifyMode": "auto",
        "wideLayout": true
       },
       "gridPos": {
        "x": 0,
        "y": 1,
        "w": 6,
        "h": 4
       }
      },
      {
       "id": 3,
