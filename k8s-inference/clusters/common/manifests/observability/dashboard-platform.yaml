      {
       "id": 18,
       "type": "stat",
       "title": "API availability",
       "description": "1 - 5xx ratio of the customer API at the gateway (route api/api) over the time range.",
       "datasource": {
        "type": "prometheus",
        "uid": "prometheus"
       },
       "targets": [
        {
         "refId": "A",
         "datasource": {
          "type": "prometheus",
          "uid": "prometheus"
         },
         "expr": "1 - (sum(increase(envoy_cluster_upstream_rq_xx{envoy_cluster_name=\"httproute/api/api/rule/0\",envoy_response_code_class=\"5\"}[$__range])) / clamp_min(sum(increase(envoy_cluster_upstream_rq_xx{envoy_cluster_name=\"httproute/api/api/rule/0\"}[$__range])), 1))",
         "legendFormat": "",
         "instant": true,
         "range": false
        }
       ],
       "fieldConfig": {
        "defaults": {
         "unit": "percentunit",
         "color": {
          "mode": "thresholds"
         },
         "thresholds": {
          "mode": "absolute",
          "steps": [
           {
            "color": "red",
            "value": null
           },
           {
            "color": "orange",
            "value": 0.98
           },
           {
            "color": "green",
            "value": 0.995
           }
          ]
         },
         "decimals": 3
        },
        "overrides": []
       },
       "options": {
        "reduceOptions": {
         "calcs": [
          "lastNotNull"
         ],
         "fields": "",
         "values": false
        },
