       },
       "options": {
        "reduceOptions": {
         "calcs": [
          "lastNotNull"
         ],
         "fields": "",
         "values": false
        },
        "textMode": "auto",
        "colorMode": "value",
        "graphMode": "none",
        "justifyMode": "auto",
        "wideLayout": true
       },
       "gridPos": {
        "x": 20,
        "y": 1,
        "w": 4,
        "h": 4
       }
      },
      {
       "id": 32,
       "type": "table",
       "title": "InferenceService status",
       "description": "1 = condition True, 0 = False (from kube-state-metrics custom-resource state).",
