        },
        "overrides": []
       },
       "options": {
        "reduceOptions": {
         "calcs": [
          "lastNotNull"
         ],
         "fields": "",
         "values": false
        },
        "textMode": "auto",
        "colorMode": "value",
        "graphMode": "none",
        "justifyMode": "auto",
        "wideLayout": true
       },
       "gridPos": {
        "x": 4,
        "y": 1,
        "w": 4,
        "h": 4
       }
      },
      {
       "id": 28,
       "type": "stat",
       "title": "Endpoint pods running",
       "description": "",
       "datasource": {
        "type": "prometheus",
        "uid": "prometheus"
       },
       "targets": [
        {
         "refId": "A",
         "datasource": {
          "type": "prometheus",
          "uid": "prometheus"
         },
         "expr": "sum(kn_revision_pods_count{k8s_namespace_name=~\"$namespace\",kn_service_name=~\"$service\"}) or vector(0)",
         "legendFormat": "",
