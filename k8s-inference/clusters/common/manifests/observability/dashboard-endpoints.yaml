        "y": 1,
        "w": 4,
        "h": 4
       }
      },
      {
       "id": 29,
       "type": "stat",
       "title": "Endpoints at zero",
       "description": "Services whose every revision has 0 pods (scaled to zero).",
       "datasource": {
        "type": "prometheus",
        "uid": "prometheus"
       },
       "targets": [
        {
         "refId": "A",
         "datasource": {
          "type": "prometheus",
          "uid": "prometheus"
         },
         "expr": "count(sum by (kn_service_name) (kn_revision_pods_count{k8s_namespace_name=~\"$namespace\",kn_service_name=~\"$service\"}) == 0) or vector(0)",
         "legendFormat": "",
         "instant": true,
         "range": false
        }
       ],
       "fieldConfig": {
        "defaults": {
         "unit": "short",
         "color": {
          "mode": "thresholds"
         },
         "thresholds": {
          "mode": "absolute",
          "steps": [
           {
            "color": "blue",
            "value": null
           }
          ]
         }
        },
        "overrides": []
       },
       "options": {
        "reduceOptions": {
         "calcs": [
          "lastNotNull"
         ],
         "fields": "",
         "values": false
        },
        "textMode": "auto",
        "colorMode": "value",
        "graphMode": "none",
        "justifyMode": "auto",
        "wideLayout": true
       },
       "gridPos": {
        "x": 12,
        "y": 1,
        "w": 4,
        "h": 4
       }
      },
      {
       "id": 30,
       "type": "stat",
       "title": "Scale-from-zero events",
       "description": "Transitions 0 -> >0 pods in the dashboard time range (cold starts).",
       "datasource": {
        "type": "prometheus",
        "uid": "prometheus"
       },
       "targets": [
        {
         "refId": "A",
         "datasource": {
          "type": "prometheus",
          "uid": "prometheus"
         },
         "expr": "sum(sum_over_time(((clamp_max(sum by (kn_service_name) (kn_revision_pods_count{k8s_namespace_name=~\"$namespace\",kn_service_name=~\"$service\"}),1) - clamp_max(sum by (kn_service_name) (kn_revision_pods_count{k8s_namespace_name=~\"$namespace\",kn_service_name=~\"$service\"} offset 30s),1)) == bool 1)[$__range:30s])) or vector(0)",
         "legendFormat": "",
         "instant": true,
         "range": false
        }
       ],
       "fieldConfig": {
        "defaults": {
         "unit": "short",
         "color": {
          "mode": "thresholds"
         },
         "thresholds": {
          "mode": "absolute",
          "steps": [
           {
            "color": "orange",
            "value": null
           }
          ]
         }
        },
        "overrides": []
       },
       "options": {
        "reduceOptions": {
         "calcs": [
          "lastNotNull"
         ],
         "fields": "",
         "values": false
        },
        "textMode": "auto",
        "colorMode": "value",
        "graphMode": "none",
        "justifyMode": "auto",
        "wideLayout": true
       },
       "gridPos": {
        "x": 16,
        "y": 1,
        "w": 4,
        "h": 4
       }
      },
      {
       "id": 31,
       "type": "stat",
       "title": "Scale-to-zero events",
       "description": "Transitions >0 -> 0 pods in the dashboard time range.",
       "datasource": {
        "type": "prometheus",
        "uid": "prometheus"
       },
       "targets": [
        {
         "refId": "A",
         "datasource": {
          "type": "prometheus",
          "uid": "prometheus"
         },
         "expr": "sum(sum_over_time(((clamp_max(sum by (kn_service_name) (kn_revision_pods_count{k8s_namespace_name=~\"$namespace\",kn_service_name=~\"$service\"}),1) - clamp_max(sum by (kn_service_name) (kn_revision_pods_count{k8s_namespace_name=~\"$namespace\",kn_service_name=~\"$service\"} offset 30s),1)) == bool -1)[$__range:30s])) or vector(0)",
         "legendFormat": "",
         "instant": true,
         "range": false
        }
       ],
       "fieldConfig": {
        "defaults": {
         "unit": "short",
         "color": {
          "mode": "thresholds"
         },
         "thresholds": {
          "mode": "absolute",
          "steps": [
