       "datasource": {
        "type": "prometheus",
        "uid": "prometheus"
       },
       "targets": [
        {
         "refId": "A",
         "datasource": {
          "type": "prometheus",
          "uid": "prometheus"
         },
         "expr": "count(kube_inferenceservice_status_condition{type=\"Ready\",namespace=~\"$namespace\"}) or vector(0)",
         "legendFormat": "",
         "instant": true,
         "range": false
        }
       ],
       "fieldConfig": {
        "defaults": {
         "unit": "short",
         "color": {
          "mode": "thresholds"
         },
         "thresholds": {
          "mode": "absolute",
          "steps": [
           {
