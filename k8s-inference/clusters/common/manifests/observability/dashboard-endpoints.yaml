      {
       "id": 37,
       "type": "timeseries",
       "title": "In-flight requests (queue-proxy)",
       "description": "Concurrency reported by the activator per service (it proxies scale-from-zero and burst traffic); queue depth = requests waiting in the queue-proxy for a free container-concurrency slot (reported only while >0).",
       "datasource": {
        "type": "prometheus",
        "uid": "prometheus"
       },
       "targets": [
        {
         "refId": "A",
         "datasource": {
          "type": "prometheus",
          "uid": "prometheus"
         },
         "expr": "sum by (kn_service_name) (kn_revision_request_concurrency{job=~\".*knative-control-plane\",component=\"activator\",k8s_namespace_name=~\"$namespace\",kn_service_name=~\"$service\"})",
         "legendFormat": "activator {{kn_service_name}}"
        },
        {
         "refId": "B",
         "datasource": {
          "type": "prometheus",
          "uid": "prometheus"
         },
         "expr": "sum by (inferenceservice) (kn_serving_queue_depth{job=~\".*knative-queue-proxy\",inferenceservice=~\"$service_isvc\"})",
         "legendFormat": "queue depth {{inferenceservice}}"
        },
        {
         "refId": "C",
         "datasource": {
          "type": "prometheus",
          "uid": "prometheus"
         },
         "expr": "sum by (inferenceservice) (rate(kn_serving_invocation_duration_seconds_count{job=~\".*knative-queue-proxy\",inferenceservice=~\"$service_isvc\"}[$__rate_interval]))",
         "legendFormat": "invocations/s {{inferenceservice}}"
        }
       ],
       "fieldConfig": {
        "defaults": {
         "custom": {
          "lineWidth": 1,
          "fillOpacity": 10,
          "showPoints": "never",
          "drawStyle": "line",
          "stacking": {
           "mode": "none"
          }
         },
         "unit": "short",
         "min": 0
        },
        "overrides": []
       },
       "options": {
        "legend": {
         "displayMode": "list",
         "placement": "bottom",
         "showLegend": true
        },
        "tooltip": {
         "mode": "multi",
         "sort": "desc"
        }
       },
       "gridPos": {
        "x": 12,
        "y": 21,
        "w": 12,
        "h": 8
       }
      },
