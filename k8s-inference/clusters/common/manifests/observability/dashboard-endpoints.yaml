apiVersion: v1
kind: ConfigMap
metadata:
  name: serverless2-dashboard-endpoints
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
  annotations:
    serverless2.nebius/generated-by: spikes/S14-observability/gen_dashboards.py
data:
  serverless2-endpoints.json: |
    {
     "uid": "s2-endpoints",
     "title": "Serverless 2.0 / Endpoints",
     "description": "Per-InferenceService replicas, concurrency, traffic, latency and cold starts (Knative/KServe).",
     "tags": [
      "serverless2"
     ],
     "timezone": "utc",
     "editable": true,
     "graphTooltip": 1,
     "refresh": "30s",
     "schemaVersion": 39,
     "version": 1,
     "time": {
      "from": "now-6h",
      "to": "now"
     },
     "templating": {
      "list": [
       {
        "name": "namespace",
        "label": "namespace",
        "type": "query",
        "datasource": {
         "type": "prometheus",
         "uid": "prometheus"
        },
        "refresh": 2,
        "multi": true,
        "includeAll": true,
        "allValue": ".*",
        "regex": "",
        "sort": 1,
        "query": {
         "query": "label_values(kn_revision_pods_count, k8s_namespace_name)",
         "refId": "var"
        },
        "definition": "label_values(kn_revision_pods_count, k8s_namespace_name)",
        "current": {
         "selected": true,
         "text": "All",
         "value": "$__all"
        }
       },
       {
        "name": "service",
        "label": "Knative service",
        "type": "query",
        "datasource": {
         "type": "prometheus",
         "uid": "prometheus"
        },
        "refresh": 2,
        "multi": true,
        "includeAll": true,
        "allValue": ".*",
        "regex": "",
        "sort": 1,
        "query": {
         "query": "label_values(kn_revision_pods_count{k8s_namespace_name=~\"$namespace\"}, kn_service_name)",
         "refId": "var"
        },
        "definition": "label_values(kn_revision_pods_count{k8s_namespace_name=~\"$namespace\"}, kn_service_name)",
        "current": {
         "selected": true,
         "text": "All",
         "value": "$__all"
        }
       },
       {
        "name": "service_isvc",
        "label": "InferenceService",
        "type": "query",
        "datasource": {
         "type": "prometheus",
         "uid": "prometheus"
        },
        "refresh": 2,
        "multi": true,
        "includeAll": true,
        "allValue": ".*",
        "regex": "",
        "sort": 1,
        "query": {
         "query": "label_values(kube_inferenceservice_status_condition{namespace=~\"$namespace\"}, name)",
         "refId": "var"
        },
        "definition": "label_values(kube_inferenceservice_status_condition{namespace=~\"$namespace\"}, name)",
        "current": {
         "selected": true,
         "text": "All",
         "value": "$__all"
        }
       }
      ]
     },
     "panels": [
      {
       "id": 25,
       "type": "row",
       "title": "InferenceServices",
       "collapsed": false,
       "gridPos": {
        "x": 0,
        "y": 0,
        "w": 24,
        "h": 1
       },
       "panels": []
      },
      {
       "id": 26,
       "type": "stat",
       "title": "InferenceServices Ready",
       "description": "",
       "datasource": {
        "type": "prometheus",
        "uid": "prometheus"
       },
       "targets": [
        {
         "refId": "A",
         "datasource": {
          "type": "prometheus",
          "uid": "prometheus"
         },
         "expr": "sum(kube_inferenceservice_status_condition{type=\"Ready\",namespace=~\"$namespace\"}) or vector(0)",
         "legendFormat": "",
         "instant": true,
         "range": false
        }
       ],
       "fieldConfig": {
        "defaults": {
         "unit": "short",
         "color": {
          "mode": "thresholds"
         },
         "thresholds": {
          "mode": "absolute",
          "steps": [
           {
            "color": "green",
            "value": null
           }
          ]
         }
        },
        "overrides": []
       },
       "options": {
        "reduceOptions": {
         "calcs": [
          "lastNotNull"
         ],
         "fields": "",
         "values": false
        },
        "textMode": "auto",
        "colorMode": "value",
        "graphMode": "none",
        "justifyMode": "auto",
        "wideLayout": true
       },
       "gridPos": {
        "x": 0,
        "y": 1,
        "w": 4,
        "h": 4
       }
      },
      {
       "id": 27,
       "type": "stat",
       "title": "InferenceServices total",
