         "expr": "kn_revision_panic_mode{k8s_namespace_name=~\"$namespace\",kn_service_name=~\"$service\"}",
         "legendFormat": "panic {{kn_revision_name}}"
        },
        {
         "refId": "B",
         "datasource": {
          "type": "prometheus",
          "uid": "prometheus"
         },
         "expr": "kn_revision_capacity_excess{k8s_namespace_name=~\"$namespace\",kn_service_name=~\"$service\"}",
         "legendFormat": "excess capacity {{kn_revision_name}}"
