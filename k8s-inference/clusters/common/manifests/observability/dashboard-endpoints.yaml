       "targets": [
        {
         "refId": "A",
         "datasource": {
          "type": "prometheus",
          "uid": "prometheus"
         },
         "expr": "kube_inferenceservice_status_condition{namespace=~\"$namespace\",type=~\"Ready|PredictorReady|IngressReady|RoutesReady\"}",
         "legendFormat": "",
         "instant": true,
         "range": false,
         "format": "table"
        }
       ],
       "fieldConfig": {
        "defaults": {
         "unit": "short",
         "custom": {
          "align": "auto",
          "filterable": true
         }
        },
        "overrides": [
         {
          "matcher": {
           "id": "byType",
           "options": "number"
          },
          "properties": [
           {
            "id": "custom.cellOptions",
            "value": {
             "type": "color-background"
            }
           },
           {
            "id": "thresholds",
            "value": {
             "mode": "absolute",
             "steps": [
