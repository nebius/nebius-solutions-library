        }
       },
       "gridPos": {
        "x": 0,
        "y": 13,
        "w": 12,
        "h": 8
       }
      },
      {
       "id": 35,
       "type": "timeseries",
       "title": "Desired vs requested vs actual (per revision)",
       "description": "",
       "datasource": {
        "type": "prometheus",
        "uid": "prometheus"
       },
       "targets": [
        {
         "refId": "A",
         "datasource": {
          "type": "prometheus",
          "uid": "prometheus"
         },
         "expr": "kn_revision_pods_desired{k8s_namespace_name=~\"$namespace\",kn_service_name=~\"$service\"}",
         "legendFormat": "desired {{kn_revision_name}}"
        },
        {
         "refId": "B",
         "datasource": {
          "type": "prometheus",
          "uid": "prometheus"
         },
         "expr": "kn_revision_pods_requested{k8s_namespace_name=~\"$namespace\",kn_service_name=~\"$service\"}",
         "legendFormat": "requested {{kn_revision_name}}"
        },
        {
         "refId": "C",
