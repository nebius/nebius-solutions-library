        "w": 12,
        "h": 8
       }
      },
      {
       "id": 36,
       "type": "timeseries",
       "title": "Concurrency (stable) vs target",
       "description": "",
       "datasource": {
        "type": "prometheus",
        "uid": "prometheus"
       },
       "targets": [
        {
         "refId": "A",
         "datasource": {
          "type": "prometheus",
          "uid": "prometheus"
         },
         "expr": "kn_revision_concurrency_stable{k8s_namespace_name=~\"$namespace\",kn_service_name=~\"$service\"}",
         "legendFormat": "{{kn_service_name}}"
        },
        {
         "refId": "B",
         "datasource": {
          "type": "prometheus",
          "uid": "prometheus"
         },
         "expr": "kn_revision_concurrency_target{k8s_namespace_name=~\"$namespace\",kn_service_name=~\"$service\"}",
         "legendFormat": "target {{kn_service_name}}"
        }
       ],
       "fieldConfig": {
        "defaults": {
