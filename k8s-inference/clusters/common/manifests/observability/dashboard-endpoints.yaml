          "type": "prometheus",
          "uid": "prometheus"
         },
         "expr": "kn_revision_pods_not_ready_count{k8s_namespace_name=~\"$namespace\",kn_service_name=~\"$service\"}",
         "legendFormat": "not ready {{kn_revision_name}}"
        }
       ],
       "fieldConfig": {
        "defaults": {
         "custom": {
          "lineWidth": 1,
          "fillOpacity": 0,
          "showPoints": "never",
          "drawStyle": "line",
          "stacking": {
           "mode": "none"
          }
         },
         "unit": "short",
         "min": 0
        },
        "overrides": []
       },
       "options": {
        "legend": {
         "displayMode": "list",
