           "customresource_kind": true,
           "customresource_version": true,
           "pod": true
          },
          "renameByName": {
           "Value": "status"
          },
          "indexByName": {
           "namespace": 0,
           "name": 1,
           "type": 2,
           "status": 3
          }
         }
        }
