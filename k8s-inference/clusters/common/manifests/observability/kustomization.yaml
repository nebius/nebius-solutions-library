# Shared base for the `observability` component; clusters/<cluster>/apps/overlays/ add the cluster-specific parts
# (the cost-report cluster name). Alloy, the DCGM exporter and OpenCost are platform apps of their own
# (clusters/common/apps/{alloy,dcgm-exporter,opencost}.yaml, values in clusters/common/values/) since the fleet
# Argo CD manages every cluster: an Application object inside a manifest would land on the target cluster, not
# on the Argo CD that manages it.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - alert-sink.yaml
  - cost-export.yaml
  - dashboard-cost.yaml
  - dashboard-endpoints.yaml
  - dashboard-jobs.yaml
  - dashboard-logs.yaml
  - dashboard-platform.yaml
  - datasource-loki.yaml
  - rules.yaml
  - rules-capacity.yaml
  - scrape.yaml
