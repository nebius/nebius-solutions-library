       "datasource": {
        "type": "prometheus",
        "uid": "prometheus"
       },
       "targets": [
        {
         "refId": "A",
         "datasource": {
          "type": "prometheus",
          "uid": "prometheus"
         },
         "expr": "((sum(sum_over_time(serverless2:nodes:count_by_pool{pool=\"h100-spot-1x\"}[$__range:1m]) / 60) or vector(0)) * $price_h100_spot) + ((sum(sum_over_time(serverless2:nodes:count_by_pool{pool=\"rtx6000-spot-1x\"}[$__range:1m]) / 60) or vector(0)) * $price_rtx_spot)",
         "legendFormat": "",
         "instant": true,
         "range": false
        }
       ],
       "fieldConfig": {
        "defaults": {
         "unit": "currencyUSD",
         "color": {
          "mode": "thresholds"
         },
         "thresholds": {
          "mode": "absolute",
          "steps": [
           {
            "color": "green",
            "value": null
           }
          ]
         },
         "decimals": 2
        },
        "overrides": []
       },
       "options": {
        "reduceOptions": {
         "calcs": [
          "lastNotNull"
         ],
         "fields": "",
         "values": false
        },
        "textMode": "auto",
