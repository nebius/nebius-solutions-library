apiVersion: v1
kind: ConfigMap
metadata:
  name: serverless2-dashboard-cost
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
  annotations:
    serverless2.nebius/generated-by: spikes/S14-observability/gen_dashboards.py
data:
  serverless2-cost.json: |
    {
     "uid": "s2-cost",
     "title": "Serverless 2.0 / Cost",
     "description": "GPU-hours paid (nodes) and used (pod requests) per pool, namespace, endpoint and run, priced with the variables at the top; LiteLLM spend per key.",
     "tags": [
      "serverless2"
     ],
     "timezone": "utc",
     "editable": true,
     "graphTooltip": 1,
     "refresh": "1m",
     "schemaVersion": 39,
     "version": 1,
     "time": {
      "from": "now-24h",
      "to": "now"
     },
     "templating": {
      "list": [
       {
        "name": "price_h100_spot",
        "label": "H100 spot $/GPU-h",
        "type": "textbox",
        "query": "2.15",
        "description": "Hub pool h100-spot-1x: spot price cap",
        "current": {
         "selected": false,
         "text": "2.15",
         "value": "2.15"
        },
        "options": [
         {
          "selected": true,
          "text": "2.15",
          "value": "2.15"
         }
        ]
       },
       {
        "name": "price_rtx_spot",
        "label": "RTX PRO 6000 spot $/GPU-h",
        "type": "textbox",
        "query": "0.79",
        "description": "eu-south1 pool rtx6000-spot-1x: spot list price (from)",
        "current": {
         "selected": false,
         "text": "0.79",
         "value": "0.79"
        },
        "options": [
         {
          "selected": true,
          "text": "0.79",
          "value": "0.79"
         }
        ]
       },
       {
        "name": "price_h100_ondemand",
        "label": "H100 on-demand $/GPU-h",
        "type": "textbox",
        "query": "3.85",
        "description": "",
        "current": {
         "selected": false,
         "text": "3.85",
         "value": "3.85"
        },
        "options": [
         {
          "selected": true,
          "text": "3.85",
          "value": "3.85"
         }
        ]
       },
       {
        "name": "price_rtx_ondemand",
        "label": "RTX PRO 6000 on-demand $/GPU-h",
        "type": "textbox",
        "query": "1.80",
        "description": "",
        "current": {
         "selected": false,
         "text": "1.80",
         "value": "1.80"
        },
        "options": [
         {
          "selected": true,
          "text": "1.80",
          "value": "1.80"
         }
        ]
       }
      ]
