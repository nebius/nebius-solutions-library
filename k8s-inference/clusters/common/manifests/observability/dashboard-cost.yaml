        "x": 0,
        "y": 0,
        "w": 24,
        "h": 1
       },
       "panels": []
      },
      {
       "id": 76,
       "type": "stat",
       "title": "Paid GPU-hours per pool",
       "description": "Node-hours of the GPU pools in the time range = what the provider bills (nodes exist whether or not a pod uses the GPU).",
       "datasource": {
        "type": "prometheus",
        "uid": "prometheus"
       },
       "targets": [
        {
         "refId": "A",
         "datasource": {
          "type": "prometheus",
          "uid": "prometheus"
         },
         "expr": "sum by (pool) (sum_over_time(serverless2:nodes:count_by_pool{pool!=\"system\"}[$__range:1m])) / 60",
         "legendFormat": "{{pool}}",
         "instant": true,
         "range": false
        }
       ],
       "fieldConfig": {
        "defaults": {
         "unit": "h",
         "color": {
          "mode": "thresholds"
         },
         "thresholds": {
          "mode": "absolute",
          "steps": [
           {
            "color": "blue",
            "value": null
           }
          ]
         },
         "decimals": 2
        },
        "overrides": []
       },
       "options": {
        "reduceOptions": {
         "calcs": [
          "lastNotNull"
         ],
         "fields": "",
         "values": false
        },
        "textMode": "value_and_name",
        "colorMode": "value",
        "graphMode": "none",
        "justifyMode": "auto",
        "wideLayout": true
       },
       "gridPos": {
        "x": 0,
        "y": 1,
        "w": 6,
        "h": 4
       }
      },
      {
       "id": 77,
