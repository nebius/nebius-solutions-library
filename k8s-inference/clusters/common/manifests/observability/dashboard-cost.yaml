         "expr": "(sum(sum_over_time(serverless2:pod_gpu_requests:running[$__range:1m])) or vector(0)) / clamp_min(sum(sum_over_time(serverless2:nodes:count_by_pool{pool!=\"system\"}[$__range:1m])), 1)",
