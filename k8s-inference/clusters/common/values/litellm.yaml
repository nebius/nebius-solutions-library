# Helm values for the litellm Application (both clusters unless hubOnly); version pinned in clusters/common/apps/litellm.yaml
replicaCount: 2                  # HA (readiness item 1): stateless proxy, state in the managed PostgreSQL (db.endpoint per cluster)
topologySpreadConstraints:
  - maxSkew: 1
    topologyKey: kubernetes.io/hostname
    whenUnsatisfiable: ScheduleAnyway
    labelSelector:
      matchLabels: { app.kubernetes.io/name: litellm }
masterkeySecretName: litellm-master
masterkeySecretKey: masterkey
envVars:
  STORE_MODEL_IN_DB: "True"
  REDIS_HOST: ratelimit-redis.envoy-gateway-system.svc.cluster.local
  REDIS_PORT: "6379"
db:
  useExisting: true
  deployStandalone: false
  endpoint: postgres-rw.data.svc.cluster.local
  database: litellm
  secret:
    name: litellm-db
    usernameKey: username
    passwordKey: password
proxy_config:
  model_list: []
  # a model deployed in several regions is one model group with one deployment per region (services/api/models.py
  # litellm_group_upsert): the router spreads calls by load, retries once on another deployment, and rests a
  # deployment for a minute after three failures (a region that is down or cold-starting is skipped)
  router_settings:
    routing_strategy: least-busy
    num_retries: 1
    allowed_fails: 3
    cooldown_time: 60
  general_settings:
    master_key: os.environ/PROXY_MASTER_KEY
    store_model_in_db: true
    fail_closed_budget_enforcement: true   # (fail_closed_rate_limit_enforcement exists only after 1.104; rate limits stay per pod while Redis is down)
    # LiteLLM refreshes "model info" every 300 s with GET <api_base>/models on every deployment (proxy_server.py
    # refresh_model_info, MODEL_INFO_REFRESH_SECONDS); through the gateway that request wakes every scaled-to-zero
    # endpoint, so an idle GPU model ran most of the time. Nothing here needs that refresh.
    disable_model_info_refresh: true
