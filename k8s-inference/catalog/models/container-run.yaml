id: container-run
displayName: Container job (generic run class)
description: Run any container image with a command on 0-8 GPUs; inputs synced from a bucket prefix to /work/in, everything written under /work is uploaded to the operation's output prefix; /work is a per-operation volume that survives spot interruptions (checkpoint under /work/checkpoint, resume automatically or with :resume). Fine-tuning, data processing, custom simulations.
task: generic
mode: run
protocol: kubernetes-job
gpu: { count: "0-8", classes: [h100, h200, b200, b300, gb300, rtx-pro-6000, l40s] }   # every class a fleet may declare; the fleet filters the list to its own classes
price: { unit: gpu-hour, usd: 1.60 }       # display; billing uses deployments.<cluster>.price_per_gpu_hour
job:                                        # rendered by services/api/jobs.py; {{name}} = parameter
  image: "{{image}}"
  scratch: "{{scratch}}"                  # network (per-run volume, resumable) | local-nvme (host NVMe emptyDir on pools with local_nvme)
  command: "{{command}}"                    # string -> /bin/sh -c; the model image needs /bin/sh
  argsParameter: args                       # typed input list, handled by jobs.build_run (not string interpolation)
  envParameter: env                         # typed environment map, merged with the fixed work/checkpoint variables
  env: { CHECKPOINT_DIR: /work/checkpoint, OUTPUT_DIR: /work/out, INPUT_DIR: /work/in, OPERATION: "{{operation}}" }
  gpu: "{{gpus}}"
  cpu: "{{cpu}}"
  memory: "{{memory}}"
  pvcSizeGi: "{{disk_gi}}"
  shm: 16Gi
  imagePullSecret: ngc
  data: "{{data}}"                          # a directory of the tenant's shared data, mounted at /data (empty = none; docs/JOBS.md "Shared data")
  dataMountPath: /data
  dataReadOnly: "{{data_readonly}}"
  weights: "{{weights}}"
  weightsMountPath: /weights
parameters:
  - { name: scratch, type: string, label: Scratch storage, default: network, help: "network = per-run network volume (resumes after preemption); local-nvme = host NVMe of the node (fastest, gone with the pod, checkpoint to the bucket yourself)" }
  - { name: image, type: string, label: Container image, required: true, help: "registry.serverless2.local/<nvcr|ghcr|docker|quay|k8s|nebius>/<path> goes through the regional cache (docs/IMAGES.md); any public reference also works" }
  - { name: command, type: string, label: Command, required: true, help: "run with /bin/sh -c inside /work; checkpoint under /work/checkpoint, write results under /work/out" }
  - { name: args, type: text, label: Arguments, default: [], help: "JSON array of command arguments" }
  - { name: env, type: text, label: Environment variables, default: {}, help: "JSON object of environment names and string values" }
  - { name: gpus, type: number, label: GPUs, default: 1 }
  - { name: cpu, type: string, label: CPU request, default: "8" }
  - { name: memory, type: string, label: Memory, default: 64Gi }
  - { name: disk_gi, type: number, label: Work volume (GiB), default: 100 }
  - { name: data, type: string, label: Shared data directory, default: "", help: "optional; a directory of the tenant's area on the region's shared filesystem, mounted read-only at /data (reference databases, model parameters): nothing is synced per run" }
  - { name: data_readonly, type: boolean, label: Shared data read-only, default: true, help: "false mounts it writable: a seeding run fills the directory" }
  - { name: weights, type: string, label: Model weights, default: "", help: "a directory of the region's shared model weights (the endpoints' cache), mounted read-only at /weights" }
  - { name: input_prefix, type: string, label: Input prefix (s3://<tenant bucket>/...), default: "", help: "optional; synced to /work/in before the first attempt" }
