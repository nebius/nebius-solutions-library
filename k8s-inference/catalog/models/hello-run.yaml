id: hello-run
displayName: Hello (CPU run-class smoke test)
description: Writes a result artifact to the tenant bucket; proves the operation and artifact chain without a GPU.
task: smoke-test
mode: run
protocol: kubernetes-job
gpu: none
price: { unit: call, usd: 0 }
job:
  image: registry.serverless2.local/docker/library/busybox:1.36
  command: |
    echo "hello-run start $(date -u +%FT%TZ) message={{message}}"; sleep {{seconds}}
    printf '{"message":"{{message}}","seconds":{{seconds}},"finished_at":"%s"}\n' "$(date -u +%FT%TZ)" > /work/out/result.json
    echo "hello-run done"
  gpu: 0
  cpu: 100m
  memory: 128Mi
  pvcSizeGi: 1
  graceSeconds: 10
  s3Env: false
deployments: { hub: {}, eu-south1: {} }
parameters:
  - { name: message, type: string, label: Message, default: hello }
  - { name: seconds, type: number, label: Seconds to run, default: 5 }
