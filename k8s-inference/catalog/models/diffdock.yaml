id: diffdock
displayName: DiffDock 2 (NVIDIA NIM, molecular docking)
task: molecular-docking
source: { repository: nvcr.io/nim/mit/diffdock, revision: "2.2.0", license: nvidia-ai-foundation-models-community }
mode: sync                       # also suitable for async (10 s to minutes per call)
protocol: http
port: 8000
endpoints: { generate: /molecular-docking/diffdock/generate, ready: /v1/health/ready, live: /v1/health/live }
gpu: { count: 1, memoryGiB: 16, classes: [h100] }
concurrency: 1
coldStartClass: slow             # 15 GiB image; NIM model cache on a PVC after the first start
price: { unit: call, usd: 0.05 }
scaleToZero: true

runtime:
  image: registry.serverless2.local/nvcr/nim/mit/diffdock:2.2.0   # NGC through the regional cache (docs/IMAGES.md); no pull secret on the pod
  command: [/usr/bin/python3, /usr/local/bin/start_server]   # the image entrypoint is `bash -c start_server.sh`: bash as PID 1 ignores SIGTERM, pods then linger for the whole grace period after scale-to-zero
  port: 8000
  protocol: http
  env:
    - name: NGC_API_KEY
      valueFrom: { secretKeyRef: { name: ngc-api-key, key: NGC_API_KEY } }
    - { name: NIM_CACHE_PATH, value: /opt/nim/.cache }
  resources: { gpu: 1, cpu: "8", memory: 32Gi, cpuRequest: "4", memoryRequest: 16Gi }
  scaling: { minReplicas: 0, maxReplicas: 1, metric: concurrency, target: 1, containerConcurrency: 1, scaleToZeroRetention: 2m }
  timeout: 600                      # also the pod's termination grace period in Knative
  shm: { enabled: true, size: 4Gi }
  # NIM cache on the region's shared filesystem (PVC weights-shared, subPath diffdock, RWX): the first start
  # downloads the NGC weights there, every later cold start finds them. Replaces the 30 GiB emptyDir
  # that was re-filled on every start (RWO PVCs deadlock 1-GPU rollouts). Seed ahead of time with
  # ops/seed-weights (docs/OPERATIONS.md "Model weights").
  weights:
    sharedFilesystem: { enabled: true, path: diffdock, mountPath: /opt/nim/.cache }
  readinessProbe: { path: /v1/health/ready }

deployments:
  hub:
    pool: h100-spot-1x
    priorityClassName: serverless2-interactive
