id: qwen2-5-0-5b
displayName: Qwen2.5 0.5B Instruct (vLLM via KServe huggingfaceserver)
task: text-generation
source: { repository: Qwen/Qwen2.5-0.5B-Instruct, license: apache-2.0 }
mode: sync
protocol: openai                 # /openai/v1/chat/completions, /openai/v1/completions
port: 8080
endpoints: { chat: /openai/v1/chat/completions, ready: /v2/health/ready }
gpu: { count: 1, memoryGiB: 16, classes: [h100, rtx-pro-6000] }
concurrency: 4
coldStartClass: slow             # weights downloaded from HF at start (S2: 140 s with node present)
price: { unit: 1k-tokens, usd: 0.0002 }
scaleToZero: true

runtime:
  image: registry.serverless2.local/docker/kserve/huggingfaceserver:v0.20.0-gpu   # default tag is CPU-only torch
  args: ["--model_name=qwen", "--model_id=Qwen/Qwen2.5-0.5B-Instruct", "--max-model-len=4096"]
  port: 8080
  protocol: openai
  resources: { gpu: 1, cpu: "4", memory: 16Gi }
  scaling: { minReplicas: 0, maxReplicas: 1, metric: concurrency, target: 4, scaleToZeroRetention: 2m }
  timeout: 600
  shm: { enabled: true, size: 4Gi }
  # HuggingFace cache on the region's shared filesystem: weights download once, every cold start after
  # that is warm (PVC weights-shared, subPath qwen2-5-0-5b, mounted at /weights; HF_HOME points there).
  weights:
    sharedFilesystem: { enabled: true, path: qwen2-5-0-5b, mountPath: /weights }
    env: { HF_HOME: /weights, HF_HUB_CACHE: /weights/hub }

deployments:
  hub:
    pool: h100-spot-1x
    priorityClassName: serverless2-interactive
  eu-south1:
    # Scale-to-zero copy on RTX PRO 6000 with the HF cache on the region's shared filesystem
    # (enabled 2026-10-07); the public kserve image is pulled from Docker Hub in both regions.
    pool: rtx6000-spot-1x
    priorityClassName: serverless2-interactive
