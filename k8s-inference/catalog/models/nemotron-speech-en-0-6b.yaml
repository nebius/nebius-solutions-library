# Catalog entry. `runtime` are charts/endpoint values; `deployments` are per-cluster overrides.
id: nemotron-speech-en-0-6b
displayName: Nemotron Speech English 0.6B (streaming ASR)
task: speech-to-text
source: { repository: nvidia/nemotron-speech-streaming-en-0.6b, revision: ebe59e5a817142986528bbbee5dba8db7b38ed50, license: nvidia-open-model-license }
mode: sync                       # sync | async | run
protocol: websocket              # live: WebSocket /v1/audio/stream (PCM16 mono 16 kHz); file: POST /generate (https artifact URL)
port: 8000
endpoints:
  stream: /v1/audio/stream       # client sends {"type":"session.start","options":{"model":"nemotron-speech-en-0.6b","language":"en-US"}}, binary PCM frames, {"type":"input.finish"}
  file: /generate                # {"audio":{url,sha256,size_bytes,media_type},"options":{...}}; url host must be in FS2_SPEECH_ARTIFACT_HOSTS
  ready: /readyz
  metrics: /metrics
gpu: { count: 1, memoryGiB: 8, classes: [h100, rtx-pro-6000] }
concurrency: 1                   # one live session per replica (runtime returns 429 runtime_busy)
coldStartClass: medium           # weights baked into the 9 GiB image; see spikes/S10-endpoints/RESULT.md
price: { unit: audio-minute, usd: 0.006 }
scaleToZero: true

runtime:
  image: registry.serverless2.local/nebius/fs2-models/nemotron-speech/en@sha256:288f6caf0c2feb3690c963969e4a26c45a38ca1338f4abe80570b24db91423d2
  command: [python, -m, fs2_speech.server]
  port: 8000
  protocol: websocket
  env:
    - name: FS2_SPEECH_PROFILE_JSON
      value: '{"model":"nemotron-speech-en-0.6b","chunk_size_ms":560,"strip_language_tags":true,"decoding":"greedy_batch","beam_size":4,"precision":"float32","confidence":false,"cuda_graphs":false}'
    - { name: FS2_SPEECH_ARTIFACT_HOSTS, value: "storage.eu-north1.nebius.cloud,storage.eu-south1.nebius.cloud" }
    - { name: OMP_NUM_THREADS, value: "2" }
    - { name: TMPDIR, value: /cache }
    - { name: TORCHINDUCTOR_CACHE_DIR, value: /cache/inductor }
    - { name: TRITON_CACHE_DIR, value: /cache/triton }
  resources: { gpu: 1, cpu: "4", memory: 32Gi, cpuRequest: "2", memoryRequest: 16Gi }
  scaling: { minReplicas: 0, maxReplicas: 1, metric: concurrency, target: 1, containerConcurrency: 1, scaleToZeroRetention: 2m }
  timeout: 3600                  # live sessions up to 1 h (Knative max)
  shm: { enabled: true, size: 1Gi }
  volumes:
    - { name: cache, mountPath: /cache, sizeLimit: 8Gi }
    - { name: tmp, mountPath: /tmp, sizeLimit: 2Gi }
  readinessProbe: { path: /readyz }
  securityContext: { runAsNonRoot: true, runAsUser: 10001, runAsGroup: 10001, fsGroup: 10001 }
  containerSecurityContext: { allowPrivilegeEscalation: false, capabilities: { drop: [ALL] } }

deployments:
  hub:
    pool: h100-spot-1x
    priorityClassName: serverless2-interactive
  eu-south1:
    pool: rtx6000-spot-1x
    priorityClassName: serverless2-interactive
    # Live speech-to-text keeps one warm replica in the cheaper region (RTX PRO 6000);
    # the hub stays scale-to-zero. Owner requirement: STT must answer instantly.
    scaling: { minReplicas: 1 }
