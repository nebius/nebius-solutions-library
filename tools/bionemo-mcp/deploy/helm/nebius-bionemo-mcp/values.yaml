replicaCount: 2

image:
  repository: ghcr.io/nebius/nebius-bionemo-mcp
  tag: "0.1.0"
  digest: ""
  pullPolicy: IfNotPresent

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  name: ""
  annotations: {}

podAnnotations: {}
podLabels: {}
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  fsGroup: 65532
  seccompProfile:
    type: RuntimeDefault
securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

service:
  type: ClusterIP
  port: 8000

ingress:
  enabled: false
  className: ""
  annotations:
    nginx.ingress.kubernetes.io/proxy-buffering: "off"
    nginx.ingress.kubernetes.io/proxy-request-buffering: "off"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "7200"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "7200"
  hosts: []
  tls: []

auth:
  existingSecret: ""
  tokenKey: token

objectStorage:
  bucket: ""
  endpointUrl: ""
  region: us-central1
  prefix: nebius-bionemo-mcp
  existingSecret: ""
  accessKeyIdKey: access-key-id
  secretAccessKeyKey: secret-access-key

nimCatalog: {}

runtime:
  requestTimeoutSeconds: 1800
  startupProbeTimeoutSeconds: 5
  maxResponseBytes: 134217728
  presignTtlSeconds: 3600

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: "1"
    memory: 512Mi

nodeSelector: {}
tolerations: []
affinity: {}
topologySpreadConstraints: []

networkPolicy:
  enabled: true
  ingressController:
    namespaceLabels:
      kubernetes.io/metadata.name: ingress-nginx
    podLabels:
      app.kubernetes.io/name: ingress-nginx
  nimIsolation:
    enabled: true
    namespace: ""
    namespaceLabels: {}
    additionalClients:
      - namespaceLabels:
          kubernetes.io/metadata.name: monitoring
        podLabels: {}
