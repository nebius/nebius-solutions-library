apiVersion: v1
kind: Pod
metadata:
  name: "{{ include "nebius-bionemo-mcp.fullname" . }}-test-connection"
  labels:
    {{- include "nebius-bionemo-mcp.labels" . | nindent 4 }}
    app.kubernetes.io/component: test
  annotations:
    "helm.sh/hook": test
spec:
  restartPolicy: Never
  automountServiceAccountToken: false
  securityContext:
    {{- toYaml .Values.podSecurityContext | nindent 4 }}
  containers:
    - name: healthz
      image: {{ include "nebius-bionemo-mcp.image" . | quote }}
      imagePullPolicy: {{ .Values.image.pullPolicy }}
      command:
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen(
          "http://{{ include "nebius-bionemo-mcp.fullname" . }}:{{ .Values.service.port }}/healthz",
          timeout=5).read()
      securityContext:
        {{- toYaml .Values.securityContext | nindent 8 }}
