apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - install.yaml

# Rebuilt for the eMudhra CA fix: https://github.com/fluxcd/flux2/discussions/6142
images:
  - name: ghcr.io/fluxcd/source-controller
    newName: cr.nebius.cloud/soperator-proxy-ghcr-io/fluxcd/source-controller
    newTag: v1.9.6-456fa323
    digest: sha256:23bab3d00a4ec6d81f04d978480c8fc3496a58e402b95c6083731defec372549
  - name: ghcr.io/fluxcd/kustomize-controller
    newName: cr.nebius.cloud/soperator-proxy-ghcr-io/fluxcd/kustomize-controller
    newTag: v1.9.6-3974b6d7
    digest: sha256:6988157f7289fca21292884724579fc2a58c759dba4dd608571dd9be79db8b10
  - name: ghcr.io/fluxcd/helm-controller
    newName: cr.nebius.cloud/soperator-proxy-ghcr-io/fluxcd/helm-controller
    newTag: v1.6.5-27add72a
    digest: sha256:c8e171c931dd23f47e266d5fe6699a58bf7d89f387bbb612a2f92203a752c477

patches:
  # Install only the components used by Soperator. The full upstream manifest
  # also contains the image, notification, and source-watcher components.
  - target:
      group: apiextensions.k8s.io
      version: v1
      kind: CustomResourceDefinition
      name: >-
        (artifactgenerators.source.extensions.fluxcd.io|imagepolicies.image.toolkit.fluxcd.io|imagerepositories.image.toolkit.fluxcd.io|imageupdateautomations.image.toolkit.fluxcd.io|alerts.notification.toolkit.fluxcd.io|providers.notification.toolkit.fluxcd.io|receivers.notification.toolkit.fluxcd.io)
    patch: |-
      apiVersion: apiextensions.k8s.io/v1
      kind: CustomResourceDefinition
      metadata:
        name: unused
      $patch: delete

  - target:
      version: v1
      kind: ServiceAccount
      labelSelector: >-
        app.kubernetes.io/component in
        (image-automation-controller,image-reflector-controller,notification-controller,source-watcher)
    patch: |-
      apiVersion: v1
      kind: ServiceAccount
      metadata:
        name: unused
      $patch: delete

  - target:
      version: v1
      kind: Service
      labelSelector: >-
        app.kubernetes.io/component in (notification-controller,source-watcher)
    patch: |-
      apiVersion: v1
      kind: Service
      metadata:
        name: unused
      $patch: delete

  - target:
      group: apps
      version: v1
      kind: Deployment
      labelSelector: >-
        app.kubernetes.io/component in
        (image-automation-controller,image-reflector-controller,notification-controller,source-watcher)
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: unused
      $patch: delete

  - target:
      group: networking.k8s.io
      version: v1
      kind: NetworkPolicy
      name: allow-webhooks
    patch: |-
      apiVersion: networking.k8s.io/v1
      kind: NetworkPolicy
      metadata:
        name: unused
      $patch: delete

  - target:
      group: apps
      version: v1
      kind: Deployment
      name: (helm|kustomize|source)-controller
    patch: |-
      - op: remove
        path: /spec/template/spec/containers/0/args/0
      - op: add
        path: /spec/template/spec/nodeSelector
        value:
          slurm.nebius.ai/nodeset: system
      - op: add
        path: /spec/template/spec/containers/0/resources/requests/cpu
        value: 100m
