# based on https://nvidia.github.io/OSMO/main/user_guide/how_to/training/single_node.html
# tensorboard: osmo workflow port-forward <workflow ID> train --port 6006
# set TENSORBOARD_HOLD_OPEN_SECONDS=0 to skip the post-training hold window
# Self-contained single-node PyTorch training example for one L40S GPU.
workflow:
  name: test-single-training
  resources:
    default:
      platform: L40S
      cpu: 8
      gpu: 1
      memory: 24Gi
      storage: 40Gi
  tasks:
  - name: train
    image: nvcr.io/nvidia/pytorch:24.03-py3
    command: ["bash"]
    args: ["/tmp/entry.sh"]
    environment:
      PYTHONUNBUFFERED: "1"
      TENSORBOARD_HOLD_OPEN_SECONDS: "300"
    files:
    - path: /tmp/train.py
      contents: |
        import argparse
        from pathlib import Path

        import torch
        import torch.nn.functional as F
        from torch import nn, optim
        from torch.utils.data import DataLoader
        from torch.utils.tensorboard import SummaryWriter
        from torchvision import datasets, transforms


        class Net(nn.Module):
            def __init__(self):
                super().__init__()
                self.conv1 = nn.Conv2d(1, 32, kernel_size=3, stride=1)
                self.conv2 = nn.Conv2d(32, 64, kernel_size=3, stride=1)
                self.dropout1 = nn.Dropout(0.25)
                self.dropout2 = nn.Dropout(0.5)
                self.fc1 = nn.Linear(9216, 128)
                self.fc2 = nn.Linear(128, 10)

            def forward(self, x):
                x = self.conv1(x)
                x = F.relu(x)
                x = self.conv2(x)
                x = F.relu(x)
                x = F.max_pool2d(x, 2)
                x = self.dropout1(x)
                x = torch.flatten(x, 1)
                x = self.fc1(x)
                x = F.relu(x)
                x = self.dropout2(x)
                x = self.fc2(x)
                return F.log_softmax(x, dim=1)


        def evaluate(model, loader, device):
            model.eval()
            total_loss = 0.0
            total_correct = 0

            with torch.no_grad():
                for data, target in loader:
                    data = data.to(device, non_blocking=True)
                    target = target.to(device, non_blocking=True)
                    output = model(data)
                    total_loss += F.nll_loss(output, target, reduction="sum").item()
                    pred = output.argmax(dim=1, keepdim=True)
                    total_correct += pred.eq(target.view_as(pred)).sum().item()

            size = len(loader.dataset)
            return total_loss / size, total_correct / size


        def main():
            parser = argparse.ArgumentParser()
            parser.add_argument("--dataset-path", required=True)
            parser.add_argument("--tensorboard-log-dir", required=True)
            parser.add_argument("--checkpoint-dir", required=True)
            parser.add_argument("--model-save-path", required=True)
            parser.add_argument("--epochs", type=int, default=3)
            parser.add_argument("--batch-size", type=int, default=128)
            parser.add_argument("--learning-rate", type=float, default=1e-3)
            parser.add_argument("--log-every", type=int, default=20)
            args = parser.parse_args()

            dataset_path = Path(args.dataset_path)
            log_dir = Path(args.tensorboard_log_dir)
            checkpoint_dir = Path(args.checkpoint_dir)
            model_save_path = Path(args.model_save_path)

            dataset_path.mkdir(parents=True, exist_ok=True)
            log_dir.mkdir(parents=True, exist_ok=True)
            checkpoint_dir.mkdir(parents=True, exist_ok=True)
            model_save_path.parent.mkdir(parents=True, exist_ok=True)

            device = torch.device("cuda" if torch.cuda.is_available() else "cpu")
            print(f"Using device: {device}")
            if torch.cuda.is_available():
                print(f"GPU: {torch.cuda.get_device_name(0)}")

            transform = transforms.Compose(
                [
                    transforms.ToTensor(),
                    transforms.Normalize((0.1307,), (0.3081,)),
                ]
            )

            train_dataset = datasets.MNIST(
                root=dataset_path,
                train=True,
                download=True,
                transform=transform,
            )
            test_dataset = datasets.MNIST(
                root=dataset_path,
                train=False,
                download=True,
                transform=transform,
            )

            loader_kwargs = {
                "batch_size": args.batch_size,
                "num_workers": 4,
                "pin_memory": torch.cuda.is_available(),
            }
            train_loader = DataLoader(train_dataset, shuffle=True, **loader_kwargs)
            test_loader = DataLoader(test_dataset, shuffle=False, **loader_kwargs)

            model = Net().to(device)
            optimizer = optim.Adam(model.parameters(), lr=args.learning_rate)
            writer = SummaryWriter(log_dir=str(log_dir))

            global_step = 0
            for epoch in range(1, args.epochs + 1):
                model.train()
                running_loss = 0.0

                for batch_idx, (data, target) in enumerate(train_loader, start=1):
                    data = data.to(device, non_blocking=True)
                    target = target.to(device, non_blocking=True)

                    optimizer.zero_grad(set_to_none=True)
                    output = model(data)
                    loss = F.nll_loss(output, target)
                    loss.backward()
                    optimizer.step()

                    running_loss += loss.item()
                    if batch_idx % args.log_every == 0:
                        writer.add_scalar("train/loss", loss.item(), global_step)
                        writer.add_scalar(
                            "train/learning_rate",
                            optimizer.param_groups[0]["lr"],
                            global_step,
                        )
                    global_step += 1

                train_loss = running_loss / len(train_loader)
                eval_loss, eval_accuracy = evaluate(model, test_loader, device)

                writer.add_scalar("epoch/train_loss", train_loss, epoch)
                writer.add_scalar("epoch/eval_loss", eval_loss, epoch)
                writer.add_scalar("epoch/eval_accuracy", eval_accuracy, epoch)

                checkpoint_path = checkpoint_dir / f"epoch-{epoch}.pt"
                torch.save(
                    {
                        "epoch": epoch,
                        "model_state_dict": model.state_dict(),
                        "optimizer_state_dict": optimizer.state_dict(),
                        "eval_loss": eval_loss,
                        "eval_accuracy": eval_accuracy,
                    },
                    checkpoint_path,
                )

                print(
                    f"Epoch {epoch}: train_loss={train_loss:.4f}, "
                    f"eval_loss={eval_loss:.4f}, eval_accuracy={eval_accuracy:.4f}"
                )

            torch.save(model.state_dict(), model_save_path)
            writer.close()
            print(f"Saved final model to {model_save_path}")


        if __name__ == "__main__":
            main()
    - path: /tmp/entry.sh
      contents: |
        #!/usr/bin/env bash
        set -euo pipefail

        INPUT_DIR="./data"
        OUTPUT_DIR="{{output}}/experiments"
        LOG_DIR="${OUTPUT_DIR}/logs"
        CHECKPOINT_DIR="${OUTPUT_DIR}/checkpoints"
        MODEL_DIR="${OUTPUT_DIR}/models"

        cleanup() {
          if [ -n "${TENSORBOARD_PID:-}" ]; then
            kill "${TENSORBOARD_PID}" 2>/dev/null || true
            wait "${TENSORBOARD_PID}" 2>/dev/null || true
          fi
        }

        trap cleanup EXIT

        mkdir -p "${INPUT_DIR}" "${LOG_DIR}" "${CHECKPOINT_DIR}" "${MODEL_DIR}"

        echo "=== Single Node Training (L40S) ==="
        nvidia-smi || true
        echo ""
        echo "TensorBoard will be available via:"
        echo "  osmo workflow port-forward <workflow ID> train --port 6006"
        echo ""

        python3 -m tensorboard.main --logdir "${LOG_DIR}" --bind_all --port 6006 &
        TENSORBOARD_PID=$!

        sleep 2
        if ! kill -0 "${TENSORBOARD_PID}" 2>/dev/null; then
          echo "TensorBoard failed to start" >&2
          wait "${TENSORBOARD_PID}"
          exit 1
        fi

        python3 /tmp/train.py \
          --dataset-path "${INPUT_DIR}" \
          --tensorboard-log-dir "${LOG_DIR}" \
          --checkpoint-dir "${CHECKPOINT_DIR}" \
          --model-save-path "${MODEL_DIR}/mnist_cnn.pt" \
          --epochs "${EPOCHS:-3}" \
          --batch-size "${BATCH_SIZE:-128}" \
          --learning-rate "${LEARNING_RATE:-0.001}"

        echo ""
        echo "--- Saved artifacts ---"
        find "${OUTPUT_DIR}" -maxdepth 2 -type f | sort

        HOLD_OPEN_SECONDS="${TENSORBOARD_HOLD_OPEN_SECONDS:-300}"
        if [ "${HOLD_OPEN_SECONDS}" -gt 0 ]; then
          echo ""
          echo "TensorBoard is staying up for ${HOLD_OPEN_SECONDS}s for port-forward testing."
          echo "When finished, let the task exit or cancel the workflow."
          sleep "${HOLD_OPEN_SECONDS}"
        fi
    outputs:
    - dataset:
        name: single-node-training-output
