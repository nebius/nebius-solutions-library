apiVersion: kubeflow.org/${MPIJOB_API_VERSION}
kind: MPIJob
metadata:
  name: ${JOB_NAME}
  namespace: ${NAMESPACE}
  labels:
    nccl-runner/run: "${RUN_SUFFIX}"
    nccl-runner/owner: "${RUN_OWNER}"
spec:
  slotsPerWorker: ${GPUS_PER_NODE}
  ${LAUNCHER_CREATION_POLICY_LINE}
  runPolicy:
    cleanPodPolicy: Running
  mpiReplicaSpecs:
    Launcher:
      replicas: 1
      template:
        metadata:
          labels:
            nccl-runner/run: "${RUN_SUFFIX}"
            nccl-runner/role: launcher
        spec:
          containers:
            - image: ${IMAGE}
              name: nccl-test
              env:
                - name: OMPI_ALLOW_RUN_AS_ROOT
                  value: "1"
                - name: OMPI_ALLOW_RUN_AS_ROOT_CONFIRM
                  value: "1"
              command: ["/bin/bash", "-c"]
              args:
                - >
                  mpirun
                  -bind-to ${BIND_TO}
                  --map-by ${MAP_BY_SPEC}
                  -x NCCL_SOCKET_IFNAME=eth0
                  -x UCX_NET_DEVICES=${UCX_NET_DEVICE}
                  -x OMPI_MCA_coll_hcoll_enable=0
                  -x OMPI_MCA_coll_ucc_enable=0
                  -x NCCL_DEBUG=INFO
                  -x NCCL_IB_HCA=${NCCL_IB_HCA}
                  -x UCX_DC_MLX5_TX_POLICY=hw_dcs
                  /opt/nccl_tests/build/${TEST_BINARY}_perf -b 8 -e 64G -f 2 -g 1 -t 1
              resources:
                requests:
                  cpu: 1
                  memory: 128Mi
    Worker:
      replicas: ${WORKER_REPLICAS}
      template:
        metadata:
          labels:
            nccl-runner/run: "${RUN_SUFFIX}"
            nccl-runner/role: worker
        spec:
          tolerations:
            - key: nvidia.com/gpu
              operator: Exists
              effect: NoSchedule
          affinity:
            nodeAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
                nodeSelectorTerms:
                  - matchExpressions:
                      - key: nebius.com/node-group-id
                        operator: In
                        values:
                          - ${NODE_GROUP_ID}
          containers:
            - image: ${IMAGE}
              name: nccl-test
              securityContext:
                privileged: true
              resources:
                requests:
                  cpu: "${WORKER_CPU}"
                  memory: ${WORKER_MEMORY}
                  nvidia.com/gpu: ${GPUS_PER_NODE}
                limits:
                  cpu: "${WORKER_CPU_LIMIT}"
                  memory: ${WORKER_MEMORY}
                  nvidia.com/gpu: ${GPUS_PER_NODE}
              volumeMounts:
                - mountPath: /dev/shm
                  name: dshm
          volumes:
            - name: dshm
              emptyDir:
                medium: Memory
