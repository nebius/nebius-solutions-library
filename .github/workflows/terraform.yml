name: 'Terraform'

on:
  pull_request:
    paths:
      - 'k8s-training/**'
      - 'wireguard/**'
      - 'dsvm/**'
      - 'bastion/**'
      - 'modules/**'
#  schedule:
#    - cron: '30 * * * *'

permissions:
  contents: write

env:
  TF_VAR_parent_id: project-e02s5a0dpr00nk11bgb0p9
  TF_VAR_tenant_id: tenant-e00tem0x4n0edc3hv2
  TF_VAR_region: eu-north2

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      solutions: ${{ steps.parse-changed-files.outputs.solutions }}
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: List changed files
        id: changed-files
        uses: tj-actions/changed-files@v46.0.5
        with:
          files_ignore: |
            .github/**
            .assets/**
            docs/**

      - name: Match changed files
        id: parse-changed-files
        env:
          ALL_CHANGED_FILES: ${{ steps.changed-files.outputs.all_changed_files }}
        run: |
          pattern='^(k8s-training|wireguard|bastion|dsvm)$'
          matched=()

          for file in $ALL_CHANGED_FILES; do
            solution="${file%%/*}"
            if [[ "$solution" == "modules" ]]; then
              matched=("k8s-training" "wireguard" "bastion" "dsvm")
              break
            elif [[ "$solution" =~ $pattern ]]; then
              matched+=("$solution")
            fi
          done

          if ((${#matched[@]} == 0)); then
            json='[]'
          else
            json=$(printf '%s\n' "${matched[@]}" | awk 'NF && !seen[$0]++' | jq -R . | jq -s -c .)
          fi

          echo "solutions=$json" >> "$GITHUB_OUTPUT"
    
  terraform-format:
    needs: detect-changes
    runs-on: ubuntu-latest
    name: 'Terraform Format Check'

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v3
      with:
        terraform_version: "v1.11.4"

    # Checks that all Terraform configuration files adhere to a canonical format
    - name: Terraform Format
      run: terraform fmt -check -recursive . ../modules

  approve_terraform:
    needs: terraform-format
    name: 'Terraform ${{ matrix.solution }}'
    environment:
      name: project-e02s5a0dpr00nk11bgb0p9
    concurrency:
      group: project-e02s5a0dpr00nk11bgb0p9
    runs-on: ubuntu-latest

    steps:
    - name: Print the input name to STDOUT
      run: | 
        echo The username is ${{ inputs.username }} created PR ${{ github.event.number }} which triggers the pipeline, and requries approval

  terraform:
    needs: [approve_terraform, detect-changes]
    name: 'Terraform ${{ matrix.solution }}'
    environment:
      name: project-e02s5a0dpr00nk11bgb0p9
    runs-on: ubuntu-latest
    continue-on-error: true
    strategy:
      max-parallel: 4
      matrix:
        solution: ${{ fromJson(needs.detect-changes.outputs.solutions) }}

    defaults:
      run:
        shell: bash
        working-directory: ${{ matrix.solution }}

    env:
      TF_VAR_subnet_id: vpcsubnet-e02xm3ng0e6e1yvvyk
      TF_VAR_region: eu-north2
      TF_VAR_loki_access_key_id: ${{ secrets.SA_ACCESS_KEY_ID }}
      TF_VAR_loki_secret_key: ${{ secrets.SA_SECRET_KEY }}

    steps:
    # Checkout the repository to the GitHub Actions runner
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup SSH keys and agent
      run: |
        ssh-keygen -t rsa -f ~/.ssh/id_rsa -N ''
        eval $(ssh-agent)
        echo "SSH_AUTH_SOCK=$SSH_AUTH_SOCK" >> $GITHUB_ENV
        echo "SSH_AGENT_PID=$SSH_AGENT_PID" >> $GITHUB_ENV
        ssh-add

    - name: Setup s5cmd
      run: |
        pip3 install s5cmd --no-cache --quiet
        mkdir -p tests/reports

    - name: Install XMLStarlet
      run: sudo apt install -y xmlstarlet

    - name: Install Nebius CLI
      run: |
        curl -sSL https://storage.eu-north1.nebius.cloud/cli/install.sh | bash
        echo "${HOME}/.nebius/bin" >> $GITHUB_PATH

    - name: Nebius CLI init
      run: |
        cat << EOF > /tmp/sa.pem
        ${{ secrets.TERRAFORM_SA_PRIVATE_KEY }}
        EOF
        nebius profile create ${{ vars.TERRAFORM_SA_ID }} --skip-auth \
          --endpoint api.eu.nebius.cloud \
          --service-account-id ${{ vars.TERRAFORM_SA_ID }} \
          --public-key-id ${{ secrets.TERRAFORM_SA_PUBLIC_KEY_ID }} \
          --parent-id ${{ env.TF_VAR_parent_id }} \
          --private-key-file /tmp/sa.pem
        export NEBIUS_IAM_TOKEN=$(nebius iam get-access-token)
        echo "::add-mask::$NEBIUS_IAM_TOKEN"
        export TF_VAR_iam_token=$NEBIUS_IAM_TOKEN
        echo "NEBIUS_IAM_TOKEN=$NEBIUS_IAM_TOKEN" >> $GITHUB_ENV
        echo "TF_VAR_iam_token=$TF_VAR_iam_token" >> $GITHUB_ENV

    # Install the latest version of Terraform CLI and configure the Terraform CLI configuration file with a Terraform Cloud user API token
    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v3
      with:
        terraform_version: "v1.11.4"

    # Initialize a new or existing Terraform working directory by creating initial files, loading any remote state, downloading modules, etc.
    - name: Terraform Init
      run: terraform init

    # Validate terraform code
    - name: Terraform Validate
      run: terraform validate

    # Generates an execution plan for Terraform
    - name: Terraform Plan
      run: terraform plan -input=false

    # Run Terraform Tests
    - name: Terraform Test
      timeout-minutes: 150
      run: |
        report_path="tests/reports/TEST-result-${{ github.run_id }}.xml"

        if [ "${{ matrix.solution }}" != "k8s-training" ]; then
          terraform test -junit-xml="${report_path}"
          exit $?
        fi

        cluster_name="${TF_VAR_cluster_name:-k8s-training}"
        gpu_node_group_name="${cluster_name}-ng-gpu-0"
        poll_seconds=60

        terraform test -junit-xml="${report_path}" &
        test_pid=$!

        stop_test() {
          if kill -0 "${test_pid}" 2>/dev/null; then
            kill "${test_pid}" || true
            wait "${test_pid}" || true
          fi
        }

        # Fail early when the GPU node group reaches a terminal provisioning state.
        while kill -0 "${test_pid}" 2>/dev/null; do
          cluster_id="$(
            { nebius mk8s v1 cluster list --parent-id "${TF_VAR_parent_id}" --format json 2>/dev/null || true; } \
              | jq -r --arg name "${cluster_name}" '
                  [(.items // [])[] | select(.metadata.name == $name)]
                  | sort_by(.metadata.created_at)
                  | last
                  | .metadata.id // empty
                '
          )"

          if [ -n "${cluster_id}" ]; then
            node_group_json="$(
              { nebius mk8s v1 node-group list --parent-id "${cluster_id}" --format json 2>/dev/null || true; } \
                | jq -c --arg name "${gpu_node_group_name}" '
                    [(.items // [])[] | select(.metadata.name == $name)]
                    | sort_by(.metadata.created_at)
                    | last // empty
                  '
            )"

            if [ -n "${node_group_json}" ] && printf '%s\n' "${node_group_json}" | jq -e '
              (.status.events // [])
              | map(.last_occurrence)
              | any(
                  (.code == "ComputeInstanceCreationFailed") or
                  (.code == "NodeNotFound" and ((.message // "") | contains("STOPPED for longer than")))
                )
            ' >/dev/null; then
              echo "Detected fatal GPU node provisioning event for ${gpu_node_group_name}"
              printf '%s\n' "${node_group_json}" | jq -r '
                (.status.events // [])
                | map(.last_occurrence)
                | map(select(
                    (.code == "ComputeInstanceCreationFailed") or
                    (.code == "NodeNotFound" and ((.message // "") | contains("STOPPED for longer than")))
                  ))
                | .[]
              '
              stop_test
              exit 1
            fi
          fi

          sleep "${poll_seconds}"
        done

        wait "${test_pid}"

    - name: Set date in report
      run: |
        xmlstarlet ed \
        --inplace \
        -i '/testsuites' -t attr -n timestamp -v $(date --iso-8601=seconds) \
        -i '/testsuites/testsuite[*]' -t attr -n timestamp -v $(date --iso-8601=seconds) \
        -i '/testsuites/testsuite[*]/testcase' -t attr -n timestamp -v $(date --iso-8601=seconds) \
        tests/reports/TEST-result-${{ github.run_id }}.xml

    - name: Upload test results
      env:
        AWS_ACCESS_KEY_ID: ${{ secrets.SA_ACCESS_KEY_ID }}
        AWS_SECRET_ACCESS_KEY: ${{ secrets.SA_SECRET_KEY }}
        AWS_REGION: ${{ env.TF_VAR_region }}
        AWS_DEFAULT_REGION: ${{ env.TF_VAR_region }}
      continue-on-error: true
      run: s5cmd --endpoint-url "https://storage.${TF_VAR_region}.nebius.cloud" sync tests/reports/ s3://terraform-test-reports/${{ matrix.solution }}/
      if: always()

    - name: Load test report history
      uses: actions/checkout@v4
      if: always()
      continue-on-error: true
      with:
        ref: gh-pages
        path: gh-pages

    - name: Build test report
      uses: simple-elf/allure-report-action@v1.15
      if: always()
      with:
        gh_pages: gh-pages
        keep_reports: 100
        subfolder: ${{ matrix.solution }}
        allure_results: ${{ matrix.solution }}/tests/reports

    - name: Publish test report
      uses: peaceiris/actions-gh-pages@v4
      if: always()
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_branch: gh-pages
        publish_dir: allure-history
        keep_files: true

  cleanup-infra:
    name: 'Cleanup Infra'
    environment:
      name: project-e02s5a0dpr00nk11bgb0p9
    concurrency:
      group: project-e02s5a0dpr00nk11bgb0p9
    runs-on: ubuntu-latest
    needs: terraform
    if: always() && needs.terraform.result
    steps:
    - name: Status of the tf tests
      run: echo TF Matrix Job result is ${{ needs.terraform.result }}

    - name: Install Nebius CLI
      run: |
        curl -sSL https://storage.eu-north1.nebius.cloud/cli/install.sh | bash
        echo "${HOME}/.nebius/bin" >> $GITHUB_PATH

    - name: Nebius CLI init
      run: |
        cat << EOF > /tmp/sa.pem
        ${{ secrets.TERRAFORM_SA_PRIVATE_KEY }}
        EOF
        nebius profile create ${{ vars.TERRAFORM_SA_ID }} --skip-auth \
          --endpoint api.eu.nebius.cloud \
          --service-account-id ${{ vars.TERRAFORM_SA_ID }} \
          --public-key-id ${{ secrets.TERRAFORM_SA_PUBLIC_KEY_ID }} \
          --parent-id ${{ env.TF_VAR_parent_id }} \
          --private-key-file /tmp/sa.pem

    - name: Setup s5cmd
      run: |
        pip3 install s5cmd --no-cache --quiet

    - name: Cleanup buckets
      continue-on-error: true
      env:
        AWS_ACCESS_KEY_ID: ${{ secrets.SA_ACCESS_KEY_ID }}
        AWS_SECRET_ACCESS_KEY: ${{ secrets.SA_SECRET_KEY }}
        AWS_REGION: ${{ env.TF_VAR_region }}
        AWS_DEFAULT_REGION: ${{ env.TF_VAR_region }}
      run: |
        for resource in \
          "storage bucket" \
        ; do
        echo Cleaning up buckets $resource
        eval nebius --format json $resource list \
          | jq -r 'try .items[] | select(.metadata.name!="terraform-test-reports") | .metadata.name' \
          | xargs -r -t -n 1 -I {} \
            s5cmd --endpoint-url "https://storage.${TF_VAR_region}.nebius.cloud" rm "s3://{}/*"
        done

    - name: Perform forced cleanup
      run: |
        for resource in \
          "mk8s v1 cluster" \
          "compute v1 instance" \
          "compute v1 filesystem" \
          "compute v1 disk" \
          "compute v1 gpu-cluster" \
          "vpc v1alpha1 allocation" \
        ; do
          echo Deleting all $resource
          eval nebius --format json $resource list \
          | jq -r 'try .items[] | select(.metadata.name!="terraform-test-reports") | .metadata.id' \
          | eval xargs -r -n 1 nebius $resource delete --id
        done

    - name: Force delete storage buckets (ttl=0)
      run: |
        nebius --format json storage bucket list --parent-id "${TF_VAR_parent_id}" \
          | jq -r '(.items // [])[] | select(.metadata.name!="terraform-test-reports") | .metadata.id' \
          | while read -r bucket_id; do
              [ -z "${bucket_id}" ] && continue
              echo "Deleting bucket ${bucket_id} with --ttl 0"
              nebius storage bucket delete --id "${bucket_id}" --ttl 0 || true
            done

    - name: Purge scheduled storage buckets
      continue-on-error: true
      run: |
        nebius --format json storage bucket list --parent-id "${TF_VAR_parent_id}" \
          | jq -r '(.items // [])[] | select(.metadata.name!="terraform-test-reports") | select((.status.purge_at // null) != null) | .metadata.id' \
          | while read -r bucket_id; do
              [ -z "${bucket_id}" ] && continue
              echo "Purging bucket ${bucket_id}"
              nebius storage bucket purge --id "${bucket_id}" || true
            done
