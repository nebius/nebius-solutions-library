# CI of the k8s-inference solution (owners: CODEOWNERS).
# The same gate as `make check` inside k8s-inference (every Terraform stage validates, the example
# tfvars passes the schema, every chart and manifest renders, the unit tests pass), plus a vulnerability
# scan of the four platform images built from their Dockerfiles. No cloud access.
name: k8s-inference

on:
  pull_request:
    paths:
      - 'k8s-inference/**'
      - 'modules/external-secrets-operator/**'
      - 'modules/external-secret-mysterybox/**'
      - '.github/workflows/k8s-inference.yml'
  push:
    branches: [main]
    paths:
      - 'k8s-inference/**'
      - 'modules/external-secrets-operator/**'
      - 'modules/external-secret-mysterybox/**'
      - '.github/workflows/k8s-inference.yml'

permissions:
  contents: read

defaults:
  run:
    working-directory: k8s-inference

jobs:
  check:
    name: 'Format, lint, validate, render, test'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: "v1.12.2"
          terraform_wrapper: false   # the wrapper buffers stdin/stdout; tools/check.sh pipes into `terraform console`
      - uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4.3.1
        with:
          version: v3.16.4
      - uses: azure/setup-kubectl@776406bce94f63e41d621b960d78ee25c8b76ede # v4.0.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install ShellCheck
        run: sudo apt-get update -qq && sudo apt-get install -y shellcheck
      - name: Formatting, lint, rendering and tests
        run: make venv && make check

  images:
    name: 'Image vulnerability scan'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - name: Build the four platform images (ops first, the dispatcher copies the Nebius CLI from it)
        run: |
          docker build --pull --no-cache -q -t serverless2/ops:ci services/ops
          docker build --no-cache -q -t serverless2/dispatcher:ci --build-arg OPS_IMAGE=serverless2/ops:ci -f services/dispatcher/Dockerfile services/dispatcher
          docker build --pull --no-cache -q -t serverless2/api:ci -f services/api/Dockerfile .
          docker build --pull --no-cache -q -t serverless2/jobs:ci services/jobs
      - name: Verify effective certificate trust stores
        run: tools/check-image-trust.sh ci
      - name: trivy (a CRITICAL vulnerability with a fix fails the build)
        run: |
          for i in ops api dispatcher jobs; do
            docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:0.58.1 image \
              --severity CRITICAL --ignore-unfixed --exit-code 1 "serverless2/$i:ci"
          done
