# Generated by tools/library-sync.sh of the solution's source repository; edit it there.
# The same gate as `make check` inside k8s-inference (every Terraform stage validates, the example
# tfvars passes the schema, every chart and manifest renders, the unit tests pass), plus a vulnerability
# scan of the five platform images built from their Dockerfiles. No cloud access.
name: k8s-inference

on:
  pull_request:
    paths:
      - 'k8s-inference/**'
      - '.github/workflows/k8s-inference.yml'
  push:
    branches: [main]
    paths:
      - 'k8s-inference/**'

permissions:
  contents: read

defaults:
  run:
    working-directory: k8s-inference

jobs:
  check:
    name: 'Validate, render, test'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "v1.11.4"
      - uses: azure/setup-helm@v4
        with:
          version: v3.16.4
      - uses: azure/setup-kubectl@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Terraform format
        run: terraform fmt -check -recursive stack
      - name: Everything renders and the tests pass
        run: make venv && make check

  images:
    name: 'Image vulnerability scan'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build the five platform images (ops first, the dispatcher copies the Nebius CLI from it)
        run: |
          docker build -q -t serverless2/ops:ci services/ops
          docker build -q -t serverless2/dispatcher:ci --build-arg OPS_IMAGE=serverless2/ops:ci -f services/dispatcher/Dockerfile services/dispatcher
          docker build -q -t serverless2/api:ci -f services/api/Dockerfile .
          docker build -q -t serverless2/jobs:ci services/jobs
          docker build -q -t serverless2/ui:ci ui
      - name: trivy (a CRITICAL vulnerability with a fix fails the build)
        run: |
          for i in ops api dispatcher jobs ui; do
            docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:0.58.1 image \
              --severity CRITICAL --ignore-unfixed --exit-code 1 "serverless2/$i:ci"
          done
