apiVersion: batch/v1
kind: Job
metadata:
  name: openfold3-native-f7-donor-r3
  namespace: nim-fast-start
  labels:
    app.kubernetes.io/name: openfold3
    app.kubernetes.io/component: checkpoint-donor
    app.kubernetes.io/part-of: archvteams-2407-faststart
    nvidia.com/snapshot-checkpoint-id: openfold3-native-f7-v1
  annotations:
    archvteams.nebius.ai/validator-sha256: 679b3e027b18e78b4646569e8c6395fb5f62c4647704bb5089aa2385a20d11f5
    archvteams.nebius.ai/fixture-sha256: 09b30bf2132e3764f99d4f417b47713cd6350bd332fe3100cceb1be11589f8ae
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 3600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: openfold3
        app.kubernetes.io/component: checkpoint-donor
        app.kubernetes.io/part-of: archvteams-2407-faststart
        nvidia.com/snapshot-is-checkpoint-source: "true"
        nvidia.com/snapshot-checkpoint-id: openfold3-native-f7-v1
      annotations:
        nvidia.com/snapshot-artifact-version: "1"
        nvidia.com/snapshot-target-containers: openfold3
        nvidia.com/snapshot-storage-type: pvc
        nvidia.com/snapshot-storage-base-path: /checkpoints
        linkerd.io/inject: disabled
        sidecar.istio.io/inject: "false"
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      enableServiceLinks: false
      runtimeClassName: nvidia
      nodeSelector:
        kubernetes.io/hostname: gpu-node-a.example.invalid
      imagePullSecrets:
        - name: nvcrio-cred
      securityContext:
        seccompProfile:
          type: Localhost
          localhostProfile: profiles/block-iouring.json
      containers:
        - name: openfold3
          image: nvcr.io/nim/openfold/openfold3@sha256:6286cc7c02247ed3efe42f0f1af6c2f6f6a680b1e5cae669512c44b636aa42d2
          imagePullPolicy: IfNotPresent
          command:
            - /bin/bash
            - -lc
          args:
            - |
              set -Eeuo pipefail
              umask 077
              install -d -m 0700 /opt/nim/output/donor-validation
              printf '%s' "$VALIDATOR_SOURCE" > /opt/nim/output/donor-validation/validate_openfold3.py
              printf '%s' "$REQUEST_JSON" > /opt/nim/output/donor-validation/request-20aa.json
              unset VALIDATOR_SOURCE REQUEST_JSON

              python3 - <<'PY'
              import hashlib
              import json
              import os
              import pathlib
              import re
              import stat
              import subprocess

              expected = {
                  "validate_openfold3.py": "679b3e027b18e78b4646569e8c6395fb5f62c4647704bb5089aa2385a20d11f5",
                  "request-20aa.json": "09b30bf2132e3764f99d4f417b47713cd6350bd332fe3100cceb1be11589f8ae",
              }
              root = pathlib.Path("/opt/nim/output/donor-validation")
              for name, digest in expected.items():
                  path = root / name
                  mode = path.lstat().st_mode
                  if path.is_symlink() or not stat.S_ISREG(mode):
                      raise SystemExit(f"staged donor input is not a regular file: {name}")
                  if hashlib.sha256(path.read_bytes()).hexdigest() != digest:
                      raise SystemExit(f"staged donor input digest mismatch: {name}")

              getconf = subprocess.run(
                  ["getconf", "GNU_LIBC_VERSION"],
                  check=True,
                  capture_output=True,
                  text=True,
              ).stdout.strip()
              ldd = subprocess.run(
                  ["ldd", "--version"],
                  check=True,
                  capture_output=True,
                  text=True,
              ).stdout.splitlines()[0].strip()
              match = re.fullmatch(r"glibc ([0-9]+\.[0-9]+)", getconf)
              if match is None:
                  raise SystemExit("target GNU libc version is not canonical")
              receipt = json.dumps(
                  {
                      "schema": "archvteams.nebius.ai/target-runtime/v1",
                      "image": "nvcr.io/nim/openfold/openfold3@sha256:6286cc7c02247ed3efe42f0f1af6c2f6f6a680b1e5cae669512c44b636aa42d2",
                      "node": "gpu-node-a.example.invalid",
                      "glibc_version": match.group(1),
                      "getconf_gnu_libc_version": getconf,
                      "ldd_version_line": ldd,
                  },
                  sort_keys=True,
                  separators=(",", ":"),
              ).encode("utf-8") + b"\n"
              destination = "/snapshot-control/target-runtime.json"
              descriptor = os.open(
                  destination,
                  os.O_WRONLY | os.O_CREAT | os.O_EXCL | getattr(os, "O_NOFOLLOW", 0),
                  0o600,
              )
              with os.fdopen(descriptor, "wb") as output:
                  output.write(receipt)
                  output.flush()
                  os.fsync(output.fileno())
              PY

              python3 -m pip uninstall -y uvloop
              cd /opt/nim/workspace
              bash /opt/nim/start_server.sh &
              server_pid=$!
              trap 'kill "$server_pid" 2>/dev/null || true' TERM INT EXIT

              python3 /opt/nim/output/donor-validation/validate_openfold3.py \
                --base-url http://127.0.0.1:8000 \
                --request-file /opt/nim/output/donor-validation/request-20aa.json \
                --receipt-dir /opt/nim/output/donor-validation/receipts \
                --run-id native-f7-donor-a \
                --run-id native-f7-donor-b \
                --ready-timeout 900 \
                --timeout 600

              touch /snapshot-control/ready-for-snapshot
              wait "$server_pid"
          env:
            - name: DYN_SNAPSHOT_CONTROL_DIR
              value: /snapshot-control
            - name: NIM_CACHE_PATH
              value: /opt/nim/.cache
            - name: NGC_API_KEY
              valueFrom:
                secretKeyRef:
                  name: ngc-api-key
                  key: NGC_API_KEY
            - name: VALIDATOR_SOURCE
              valueFrom:
                configMapKeyRef:
                  name: openfold3-native-f7-validator-r3
                  key: VALIDATOR_SOURCE
            - name: REQUEST_JSON
              valueFrom:
                configMapKeyRef:
                  name: openfold3-native-f7-validator-r3
                  key: REQUEST_JSON
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          resources:
            requests:
              cpu: "10"
              memory: 120Gi
              nvidia.com/gpu: "1"
            limits:
              cpu: "11"
              memory: 180Gi
              nvidia.com/gpu: "1"
          securityContext:
            privileged: false
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            runAsUser: 0
            runAsGroup: 0
          readinessProbe:
            exec:
              command:
                - /bin/cat
                - /snapshot-control/ready-for-snapshot
            periodSeconds: 1
            timeoutSeconds: 1
            failureThreshold: 1800
          volumeMounts:
            - name: dshm
              mountPath: /dev/shm
            - name: nim-cache
              mountPath: /opt/nim/.cache
            - name: workspace
              mountPath: /opt/nim/workspace
            - name: output
              mountPath: /opt/nim/output
            - name: snapshot-control
              mountPath: /snapshot-control
              subPath: openfold3
            - name: checkpoints
              mountPath: /checkpoints
              readOnly: true
      volumes:
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: 64Gi
        - name: nim-cache
          persistentVolumeClaim:
            claimName: openfold3-native-f7-cache
        - name: workspace
          emptyDir:
            sizeLimit: 8Gi
        - name: output
          emptyDir:
            sizeLimit: 1Gi
        - name: snapshot-control
          emptyDir:
            sizeLimit: 16Mi
        - name: checkpoints
          persistentVolumeClaim:
            claimName: openfold3-native-f7-artifacts
            readOnly: true
