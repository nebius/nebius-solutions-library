apiVersion: batch/v1
kind: Job
metadata:
  name: openfold2-native-f7-donor
  namespace: nim-fast-start
  labels:
    app.kubernetes.io/name: openfold2
    app.kubernetes.io/component: checkpoint-donor
    app.kubernetes.io/part-of: archvteams-2407-faststart
    nvidia.com/snapshot-checkpoint-id: openfold2-native-f7-v1
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 1800
  template:
    metadata:
      labels:
        app.kubernetes.io/name: openfold2
        app.kubernetes.io/component: checkpoint-donor
        app.kubernetes.io/part-of: archvteams-2407-faststart
        nvidia.com/snapshot-is-checkpoint-source: "true"
        nvidia.com/snapshot-checkpoint-id: openfold2-native-f7-v1
      annotations:
        nvidia.com/snapshot-artifact-version: "1"
        nvidia.com/snapshot-target-containers: openfold2
        nvidia.com/snapshot-storage-type: pvc
        nvidia.com/snapshot-storage-base-path: /checkpoints
        linkerd.io/inject: disabled
        sidecar.istio.io/inject: "false"
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      enableServiceLinks: false
      runtimeClassName: nvidia
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: In
                    values:
                      - gpu-node-b.example.invalid
      securityContext:
        seccompProfile:
          type: Localhost
          localhostProfile: profiles/block-iouring.json
      imagePullSecrets:
        - name: nvcrio-cred
      containers:
        - name: openfold2
          image: nvcr.io/nim/openfold/openfold2@sha256:fc64916731fee39e124225829dca78e80ec24fe1891be47057d0d69209b93ab4
          imagePullPolicy: IfNotPresent
          command:
            - /bin/bash
            - -lc
          args:
            - |
              set -euo pipefail
              bash /opt/nim/start_server.sh &
              server_pid=$!
              trap 'kill "$server_pid" 2>/dev/null || true' TERM INT EXIT

              for _ in $(seq 1 900); do
                if ! kill -0 "$server_pid" 2>/dev/null; then
                  wait "$server_pid"
                  exit 1
                fi
                if curl -fsS http://127.0.0.1:8000/v1/health/ready >/dev/null; then
                  break
                fi
                sleep 1
              done
              curl -fsS http://127.0.0.1:8000/v1/health/ready >/dev/null

              python3 - <<'PY'
              import json
              import urllib.request

              endpoint = "http://127.0.0.1:8000/biology/openfold/openfold2/predict-structure-from-msa-and-template"
              for index, sequence in enumerate(("ACDEFGHIKLMNPQRSTVWY", "YWVTSRQPNMLKIHGFEDCA"), 1):
                  payload = json.dumps({
                      "input_id": f"native-f7-donor-{index}",
                      "relax_prediction": False,
                      "selected_models": [1],
                      "sequence": sequence,
                  }, sort_keys=True, separators=(",", ":")).encode("ascii")
                  request = urllib.request.Request(
                      endpoint,
                      data=payload,
                      headers={"Content-Type": "application/json"},
                      method="POST",
                  )
                  with urllib.request.urlopen(request, timeout=180) as response:
                      if response.status != 200:
                          raise RuntimeError(f"warmup {index} returned HTTP {response.status}")
                      decoded = json.loads(response.read(16 * 1024 * 1024))
                  if not isinstance(decoded, dict):
                      raise RuntimeError(f"warmup {index} returned an unexpected result shape")
                  if decoded.get("input_id") != f"native-f7-donor-{index}":
                      raise RuntimeError(f"warmup {index} returned the wrong input_id")
                  structures = decoded.get("structures_in_ranked_order")
                  if not isinstance(structures, list) or len(structures) != 1:
                      raise RuntimeError(f"warmup {index} returned the wrong structure count")
                  result = structures[0]
                  if not isinstance(result, dict) or not isinstance(result.get("structure"), str) or "ATOM" not in result["structure"]:
                      raise RuntimeError(f"warmup {index} did not return a structure")
              PY

              touch /snapshot-control/ready-for-snapshot
              wait "$server_pid"
          env:
            - name: DYN_SNAPSHOT_CONTROL_DIR
              value: /snapshot-control
            - name: NIM_CACHE_PATH
              value: /opt/nim/.cache
            - name: NGC_API_KEY
              valueFrom:
                secretKeyRef:
                  name: ngc-api-key
                  key: NGC_API_KEY
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          resources:
            requests:
              cpu: "14"
              memory: 128Gi
              nvidia.com/gpu: "1"
            limits:
              cpu: "15"
              memory: 150Gi
              nvidia.com/gpu: "1"
          securityContext:
            privileged: false
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            runAsUser: 0
            runAsGroup: 0
          readinessProbe:
            exec:
              command:
                - /bin/cat
                - /snapshot-control/ready-for-snapshot
            periodSeconds: 1
            timeoutSeconds: 1
            failureThreshold: 1800
          volumeMounts:
            - name: dshm
              mountPath: /dev/shm
            - name: nim-cache
              mountPath: /opt/nim/.cache
              readOnly: true
            - name: workspace
              mountPath: /opt/nim/workspace
            - name: output
              mountPath: /output
            - name: snapshot-control
              mountPath: /snapshot-control
              subPath: openfold2
            - name: checkpoints
              mountPath: /checkpoints
              readOnly: true
      volumes:
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: 64Gi
        - name: nim-cache
          persistentVolumeClaim:
            claimName: openfold2-nim-cache
            readOnly: true
        - name: workspace
          emptyDir:
            sizeLimit: 8Gi
        - name: output
          emptyDir:
            sizeLimit: 1Gi
        - name: snapshot-control
          emptyDir:
            sizeLimit: 16Mi
        - name: checkpoints
          persistentVolumeClaim:
            claimName: mlspec-archvteams-2407-ckpt-m3
            readOnly: true
