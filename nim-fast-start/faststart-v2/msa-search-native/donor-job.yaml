apiVersion: batch/v1
kind: Job
metadata:
  name: msa-search-native-f7-donor-r1
  namespace: nim-fast-start
  labels:
    app.kubernetes.io/name: msa-search
    app.kubernetes.io/component: checkpoint-donor
    app.kubernetes.io/part-of: archvteams-2407-faststart
    nvidia.com/snapshot-checkpoint-id: msa-search-native-f7-v1
  annotations:
    archvteams.nebius.ai/validator-sha256: 20e8951ceaaa1b81e8129d86b787c6bb009cf2e207d55829cf13f4fa9489188b
    archvteams.nebius.ai/fixture-sha256: 874b0e5e3be9776ea289fb46444032e04b63875d9d4110f1560e5435de72686a
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 3600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: msa-search
        app.kubernetes.io/component: checkpoint-donor
        app.kubernetes.io/part-of: archvteams-2407-faststart
        nvidia.com/snapshot-is-checkpoint-source: "true"
        nvidia.com/snapshot-checkpoint-id: msa-search-native-f7-v1
      annotations:
        nvidia.com/snapshot-artifact-version: "1"
        nvidia.com/snapshot-target-containers: msa-search
        nvidia.com/snapshot-storage-type: pvc
        nvidia.com/snapshot-storage-base-path: /checkpoints
        linkerd.io/inject: disabled
        sidecar.istio.io/inject: "false"
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      enableServiceLinks: false
      runtimeClassName: nvidia
      nodeSelector:
        kubernetes.io/hostname: gpu-node-a.example.invalid
      imagePullSecrets:
        - name: nvcrio-cred
      securityContext:
        seccompProfile:
          type: Localhost
          localhostProfile: profiles/block-iouring.json
      containers:
        - name: msa-search
          image: nvcr.io/nim/colabfold/msa-search@sha256:944f3cf845761be8e42b33147ae08b68c61eca7cad67bf5251e1708d03c0165c
          imagePullPolicy: IfNotPresent
          command:
            - /bin/bash
            - -lc
          args:
            - |
              set -Eeuo pipefail
              umask 077
              install -d -m 0700 /output/donor-validation
              printf '%s' "$VALIDATOR_SOURCE" > /output/donor-validation/validate_msa_search.py
              printf '%s' "$REQUEST_JSON" > /output/donor-validation/request-pdb70.json
              unset VALIDATOR_SOURCE REQUEST_JSON

              python3 - <<'PY'
              import hashlib
              import json
              import os
              import pathlib
              import re
              import stat
              import subprocess

              expected = {
                  "validate_msa_search.py": "20e8951ceaaa1b81e8129d86b787c6bb009cf2e207d55829cf13f4fa9489188b",
                  "request-pdb70.json": "874b0e5e3be9776ea289fb46444032e04b63875d9d4110f1560e5435de72686a",
              }
              root = pathlib.Path("/output/donor-validation")
              for name, digest in expected.items():
                  path = root / name
                  mode = path.lstat().st_mode
                  if path.is_symlink() or not stat.S_ISREG(mode):
                      raise SystemExit(f"staged donor input is not a regular file: {name}")
                  if hashlib.sha256(path.read_bytes()).hexdigest() != digest:
                      raise SystemExit(f"staged donor input digest mismatch: {name}")

              getconf = subprocess.run(
                  ["getconf", "GNU_LIBC_VERSION"],
                  check=True,
                  capture_output=True,
                  text=True,
              ).stdout.strip()
              ldd = subprocess.run(
                  ["ldd", "--version"],
                  check=True,
                  capture_output=True,
                  text=True,
              ).stdout.splitlines()[0].strip()
              match = re.fullmatch(r"glibc ([0-9]+\.[0-9]+)", getconf)
              if match is None:
                  raise SystemExit("target GNU libc version is not canonical")
              receipt = json.dumps(
                  {
                      "schema": "archvteams.nebius.ai/target-runtime/v1",
                      "image": "nvcr.io/nim/colabfold/msa-search@sha256:944f3cf845761be8e42b33147ae08b68c61eca7cad67bf5251e1708d03c0165c",
                      "node": "gpu-node-a.example.invalid",
                      "glibc_version": match.group(1),
                      "getconf_gnu_libc_version": getconf,
                      "ldd_version_line": ldd,
                  },
                  sort_keys=True,
                  separators=(",", ":"),
              ).encode("utf-8") + b"\n"
              destination = "/snapshot-control/target-runtime.json"
              descriptor = os.open(
                  destination,
                  os.O_WRONLY | os.O_CREAT | os.O_EXCL | getattr(os, "O_NOFOLLOW", 0),
                  0o600,
              )
              with os.fdopen(descriptor, "wb") as output:
                  output.write(receipt)
                  output.flush()
                  os.fsync(output.fileno())
              PY

              python3 -m pip uninstall -y uvloop
              bash /opt/nim/start_server.sh &
              server_pid=$!
              trap 'kill "$server_pid" 2>/dev/null || true' TERM INT EXIT

              python3 /output/donor-validation/validate_msa_search.py \
                --base-url http://127.0.0.1:8000 \
                --request-file /output/donor-validation/request-pdb70.json \
                --receipt-dir /output/donor-validation/receipts \
                --run-id native-f7-donor-a \
                --run-id native-f7-donor-b \
                --ready-timeout 900 \
                --timeout 600

              touch /snapshot-control/ready-for-snapshot
              wait "$server_pid"
          env:
            - name: DYN_SNAPSHOT_CONTROL_DIR
              value: /snapshot-control
            - name: NIM_CACHE_PATH
              value: /opt/nim/.cache
            - name: NIM_MODEL_PROFILE
              value: ad5086cc67393792e71fa57444f13eaff8425658e8fb5feea07070ca3b2d34bb
            - name: NIM_GLOBAL_MAX_MSA_DEPTH
              value: "500"
            - name: NGC_API_KEY
              valueFrom:
                secretKeyRef:
                  name: ngc-api-key
                  key: NGC_API_KEY
            - name: VALIDATOR_SOURCE
              valueFrom:
                configMapKeyRef:
                  name: msa-search-native-f7-validator-r1
                  key: VALIDATOR_SOURCE
            - name: REQUEST_JSON
              valueFrom:
                configMapKeyRef:
                  name: msa-search-native-f7-validator-r1
                  key: REQUEST_JSON
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          resources:
            requests:
              cpu: "10"
              memory: 128Gi
              nvidia.com/gpu: "1"
            limits:
              cpu: "15"
              memory: 180Gi
              nvidia.com/gpu: "1"
          securityContext:
            privileged: false
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            runAsUser: 0
            runAsGroup: 0
          readinessProbe:
            exec:
              command:
                - /bin/cat
                - /snapshot-control/ready-for-snapshot
            periodSeconds: 1
            timeoutSeconds: 1
            failureThreshold: 1800
          volumeMounts:
            - name: dshm
              mountPath: /dev/shm
            - name: nim-cache
              mountPath: /opt/nim/.cache
            - name: nim-cache
              mountPath: /opt/nim/workspace
            - name: output
              mountPath: /output
            - name: snapshot-control
              mountPath: /snapshot-control
              subPath: msa-search
            - name: checkpoints
              mountPath: /checkpoints
              readOnly: true
      volumes:
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: 16Gi
        - name: nim-cache
          persistentVolumeClaim:
            claimName: msa-search-native-f7-cache
        - name: output
          emptyDir:
            sizeLimit: 1Gi
        - name: snapshot-control
          emptyDir:
            sizeLimit: 16Mi
        - name: checkpoints
          persistentVolumeClaim:
            claimName: msa-search-native-f7-artifacts
            readOnly: true
